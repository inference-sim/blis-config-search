# Colocated vs. P/D-disaggregated Muse-Spark (nvfp4) on a full 72-GPU GB200 NVL72 rack under AgentX at ITL p99 20ms.
# MoE 256 experts top_k 8, SWA, no speculator; the rack is one NVLink domain, so every P/D handoff stays on NVLink.
# P/D pools stay at dp1 (pinned engine refuses kv_transfer under dp, blis-vllm#44) and tp >= 8 (tp4 dp1 is untested on memory).
# The colocated-tuned sweep is the fair control: P/D has to beat colocated chunking, not the 8192-token default.
# Left out: all2all_backend (identical to default at dp1 on the 64-GPU rack), prefix caching off (2.5x worse there),
# eplb, moe_backend, quantization and drafting (profile: does not apply). Sized for SWEEP_MAX_PARALLEL=8 under 3h wall.

name: muse-spark-open-816b-a42b-gb200-agentx-pd

scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: gb200-nvl72
  workload_spec: workloads/agentx-run-recipe.yaml   # the full AgentX run recipe
  gpus: 72
  engine: {max_model_len: 262144}   # at the 32k default the replay drops every trace
  concurrency: [64, 128, 256, 512]  # session lanes; 8x TP8 saturated by 512 on the 64-GPU rack
  replay:
    corpus: .corpus/traces.jsonl
    corpus_cache: /tmp/agx-cache-muse-gb200-pd
    grace_period: inf   # a request in flight at the end of the window is never cancelled

sweeps:
  - name: colocated
    # The default-engine control for every P/D sweep.
    narrative: Nine TP8 instances should lead the colocated shapes, since wider dp groups paid hundreds of ms of ITL on the 64-GPU rack.
    num-instances: [9, 3, 1]
    parallel: {tp: [8, 4], dp: [1, 2, 3, 6, 9], enable_expert_parallel: [true]}

  - name: colocated-tuned
    narrative: A bigger token budget with a long-prefill cap should hold ITL to higher load, narrowing what P/D can win.
    num-instances: [9, 3]
    parallel: {tp: [8], dp: [1, 3], enable_expert_parallel: [true]}
    engine:
      max_num_batched_tokens: [8192, 32768]
      long_prefill_token_threshold: [0, 2048]

  - name: pd-ratio
    narrative: Decode-heavy ratios should win on AgentX, since cached prefixes leave only a short uncached tail to prefill per turn.
    prefill-instances: [1, 2, 3, 4, 5]
    decode-instances: [4, 5, 6, 7, 8]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    router: &threshold
      endpoint_picker_config: [pd-prefix.yaml]
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 1024, 4096, 16384]}}

  - name: pd-always
    # Same tp8 layouts as pd-ratio; overrides take one base file, so the always-split decider is its own sweep.
    narrative: Splitting every request should trail the threshold arms, because a turn with a cached prefix pays a handoff for little prefill.
    prefill-instances: [1, 2, 3, 4, 5]
    decode-instances: [4, 5, 6, 7, 8]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    router: {endpoint_picker_config: [pd-always.yaml]}

  - name: pd-wide-decode
    narrative: TP16 decode instances should hold ITL at higher load than TP8 ones, trading batch slots for faster steps.
    prefill-instances: [1, 3, 5]
    decode-instances: [4, 3, 2]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [16], enable_expert_parallel: [true]}}
    router:
      <<: *threshold
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 4096]}}

  - name: pd-wide-prefill
    narrative: TP16 prefill instances should cut TTFT on long cold turns but cost decode slots, so they should lose on ITL-bound load.
    prefill-instances: [1, 2, 3]
    decode-instances: [7, 5, 3]
    prefill: {parallel: {tp: [16], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    router:
      <<: *threshold
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 4096]}}

  - name: pd-pool-engine
    # Decode pools prefill locally whenever the decider skips the split, so their long-prefill cap is live.
    narrative: A 32k prefill budget should matter on the prefill-light layout and a decode-pool prefill cap on the decode-heavy one.
    prefill-instances: [2, 4]
    decode-instances: [7, 5]
    prefill:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {max_num_batched_tokens: [8192, 32768]}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {long_prefill_token_threshold: [0, 2048]}
    router: {endpoint_picker_config: [pd-prefix.yaml]}

  - name: pd-decode-cudagraph
    # Per-step host cost does not interact with topology, so one layout.
    narrative: Full graph capture on the decode pool should lower ITL by a few percent, with FULL_DECODE_ONLY matching FULL there.
    prefill-instances: [3]
    decode-instances: [6]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {cudagraph_mode: [FULL, FULL_DECODE_ONLY]}
    router: {endpoint_picker_config: [pd-prefix.yaml]}

  - name: routing
    # The default router is the twin in colocated; prefix caching stays on (off cost 2.5x on the 64-GPU rack).
    narrative: Prefix affinity should beat load-only scorers, and by more across nine instances than three.
    num-instances: [9, 3]
    parallel: {tp: [8], dp: [1, 3], enable_expert_parallel: [true]}
    router:
      endpoint_picker_config: [prefix-affinity.yaml, queue-kv.yaml, load-aware.yaml]
