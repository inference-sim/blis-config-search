name: muse-spark-open-816b-a42b-h200-agentx-8gpu
scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: h200
  cluster:
    gpus_per_node: 8
  workload_spec: workloads/agentx-run-recipe.yaml
  gpus: 8
  engine:
    max_model_len: 262144
  concurrency:
  - 4
  - 8
  - 16
  - 32
  - 64
  replay:
    corpus: .corpus/traces.jsonl
    corpus_cache: /tmp/agx-cache-muse-h200
sweeps:
- name: topology-pp
  narrative: TP8 should peak highest, since every pipeline stage adds a boundary hop
    to each decode step.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    - 4
    - 2
    pp:
    - 1
    - 2
    - 4
    enable_expert_parallel:
    - true
- name: batch-caps
  narrative: A seq cap of 8 should bind on TP8, where one attention rank sees every
    lane.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    dp:
    - 1
    enable_expert_parallel:
    - true
  engine:
    max_num_seqs:
    - 8
    - 16
    max_num_batched_tokens:
    - 2048
    - 4096
    - 16384
    - 32768
- name: kv-capacity
  narrative: fp8 KV and higher memory utilization should substitute on TP8.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    dp:
    - 1
    enable_expert_parallel:
    - true
  engine:
    cache_dtype:
    - auto
    - fp8
    gpu_memory_utilization:
    - 0.85
    - 0.95
- name: moe-collective
  narrative: DeepEP low-latency should win on TP8.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    dp:
    - 1
    enable_expert_parallel:
    - true
  engine:
    all2all_backend:
    - deepep_high_throughput
    - deepep_low_latency
    - deepep_v2
    - pplx
- name: prefill-chunking
  narrative: Capping long prefills should trade a little peak throughput for a much
    lower ITL p99 at saturation.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    - 4
    pp:
    - 1
    - 2
    enable_expert_parallel:
    - true
  engine:
    long_prefill_token_threshold:
    - 2048
    - 8192
- name: cudagraph
  narrative: FULL-family capture should beat the PIECEWISE default by a few percent,
    and NONE should collapse.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    enable_expert_parallel:
    - true
  engine:
    cudagraph_mode:
    - NONE
    - FULL
    - FULL_AND_PIECEWISE
