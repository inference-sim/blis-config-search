# DISAGGREGATE SELECTIVELY: split a request only when enough of its prompt is UNCACHED.
#
# `pd-always.yaml` with the prefix-based-pd-decider in place of the always-disagg one -- the
# shape llm-d's own wide-EP configs use. A request whose prefix is already cached on a decode
# pod decodes there instead of paying a handoff for a prefill it would barely do.
#
# `nonCachedTokens` is the threshold and the knob worth sweeping (RFC #21's pd-threshold
# sweep): 16 disaggregates almost everything, 4096 only long cold prompts.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: approx-prefix-cache-producer
  parameters:
    maxPrefixTokensToMatch: 16384
    lruCapacityPerServer: 31250
- type: prefix-cache-scorer
- type: queue-scorer
- type: prefill-filter
- type: decode-filter
- type: max-score-picker
- type: prefix-based-pd-decider
  parameters:
    nonCachedTokens: 256
- type: disagg-profile-handler
  parameters:
    deciders:
      prefill: prefix-based-pd-decider
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
