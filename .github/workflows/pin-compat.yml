name: pin-compat

# The compatibility gate for a PR that moves the pinned stack. Make its `gate` job a REQUIRED
# check on main (not the others: they are skipped on ordinary PRs, see the trigger note below).
#
# A new inference-sim can need code changes in THIS repo -- v0.14.0 needed 14 files (PR #25):
# run_blis.py's UNSUPPORTED / PD_MUST_MATCH, a newly mandatory field. Those changes belong on the pin PR itself, because merging the pin is what
# starts regen-reports.yml, and a regeneration run on code that does not fit the stack spends
# hours producing broken or silently wrong reports. So the pin PR is the compatibility PR, and
# this gate keeps it unmergeable until the code fits the stack:
#
#   bump-blis-pin.yml opens a DRAFT pin PR
#     -> this gate fails, listing what broke
#     -> a person (or Claude) pushes fixes onto the same branch; the gate re-runs on each push
#     -> green: mark ready, review, merge  -> regen-reports.yml regenerates every report
#
# What it checks, all against the NEW binary (none of it is visible to a dry run):
#   specs  every committed spec validated with the new binary's `blis fields`, `blis schema` and
#          `blis catalog resolve`, so a setting the new release dropped fails here.
#   suite  the hermetic tests.
#   smoke  a few rows from each committed report's OWN ledger, re-run through run_blis.run_one:
#          a row that ran before and fails now (LOUD), or a knob that moved the numbers before
#          and now measures identically to its baseline (SILENT -- the v0.14.0 failure mode).
#
# Which work runs (scripts/ci_scope.py): a moved pin VALUE or a changed script the smoke imports selects
# every report; a changed spec, report ledger, or routing/workload file it names selects only those
# reports. A fork's pin move is refused; a fork's other changes run no smoke (its code must not reach the
# regen runner). The simulator is built once per BLIS_SHA (.github/actions/pinned-blis) and shared as an artifact.
#
# Trigger: EVERY pull request, deliberately without a `paths:` filter. A workflow skipped by a
# path filter never reports, so a required check on it would sit "pending" forever on every PR
# that does not touch pins.env. Instead `changed` compares pin VALUES against the base branch --
# a comment-only pins.env edit moves nothing -- and the heavy jobs run only when one moved.
# `gate` always reports: success when nothing moved or everything passed, failure otherwise.
# The smoke job needs the 568 MB replay corpus for the AgentX reports; it is cached per catalog
# pin, as in regen-reports.

on:
  pull_request:
  # The bot's PRs dispatch this with the PR's base and number, since their PR event starts nothing.
  workflow_dispatch:
    inputs:
      base:
        description: "branch to compare pins against (blank = check the pins as they stand)"
        required: false
      pr:
        description: "PR number to comment the result on (blank = no comment)"
        required: false

permissions:
  contents: read

concurrency:
  group: pin-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.diff.outputs.moved }}
      run: ${{ steps.reports.outputs.run }}
      reports: ${{ steps.reports.outputs.reports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - name: Did this PR move a pin's value?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then          # workflow_dispatch: check the pins as they stand
            echo "moved=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A dispatched base is a branch name; a PR's is a sha.
          if git rev-parse -q --verify "origin/$BASE" >/dev/null; then BASE="origin/$BASE"; fi
          git show "$BASE:pins.env" > /tmp/base-pins.env
          moved="$(python3 -I scripts/blis_pin.py changed /tmp/base-pins.env)"
          echo "pins moved against the base branch: $moved"
          if [ "$moved" = "{}" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - id: scope
        uses: ./.github/actions/scope
        with:
          base: ${{ github.event.pull_request.base.sha || inputs.base }}
          pins-moved: ${{ steps.diff.outputs.moved }}
      - name: Reports to smoke
        id: reports
        env: { SELECTED: "${{ steps.scope.outputs.smoke_reports }}", MOVED: "${{ steps.diff.outputs.moved }}" }
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import blis_pin
          sel = set(json.loads(os.environ["SELECTED"]))
          out = [{"id": r["id"], "replay": r["replay"]} for r in blis_pin.plan()["reports"] if r["id"] in sel]
          print("reports=" + json.dumps(out))
          print("run=" + ("true" if out or os.environ["MOVED"] == "true" else "false"))
          PY

  build:
    needs: changed
    # A fork's pin move would run the fork's code on REGEN_RUNS_ON (possibly self-hosted): no.
    if: >-
      needs.changed.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - uses: ./.github/actions/pinned-blis
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      - name: Every spec against the new binary's field list, schemas and catalog
        run: python3 -I scripts/validate_experiment.py experiments/ --blis upstream/blis --fields "$RUNNER_TEMP/fields.json"
      - name: Hermetic suite
        run: |
          set -euo pipefail
          python3 -I scripts/test_build.py
          python3 -I scripts/test_blis_pin.py
          python3 -I scripts/test_experiment.py
          python3 -I scripts/test_run_blis.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pin-compat-blis
          path: upstream/blis
          retention-days: 3

  smoke:
    needs: [changed, build]
    if: needs.changed.outputs.reports != '[]'
    runs-on: ${{ fromJSON(vars.REGEN_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        report: ${{ fromJSON(needs.changed.outputs.reports) }}
    name: smoke ${{ matrix.report.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: pin-compat-blis, path: .build }
      - name: Clone the pinned substrate release (the files the scripts read; the simulator uses its embedded data)
        id: stack
        run: |
          set -euo pipefail
          chmod +x .build/blis
          set -a; . ./pins.env; set +a
          sh scripts/clone_pinned.sh "$SUBSTRATE_REF" https://github.com/inference-sim/blis-substrate.git ../blis-substrate
          echo "substrate_ref=$SUBSTRATE_REF" >> "$GITHUB_OUTPUT"
      - name: Restore the replay corpus
        if: matrix.report.replay
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .corpus/traces.jsonl
          key: replay-corpus-${{ steps.stack.outputs.substrate_ref }}
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      - name: Re-run ${{ matrix.report.id }}'s own rows on the new binary
        run: |
          set -euo pipefail
          python3 -I scripts/blis_pin.py smoke "${{ matrix.report.id }}" \
            --blis .build/blis --catalog ../blis-substrate/catalog --registry ../blis-substrate/registry \
            --fields "$RUNNER_TEMP/fields.json" \
            --corpus .corpus/traces.jsonl --corpus-cache "$RUNNER_TEMP/agx-cache" \
            --max-parallel 2 --timeout "${{ vars.REGEN_RUN_TIMEOUT || '1800' }}" \
            --json "$RUNNER_TEMP/smoke-${{ matrix.report.id }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-${{ matrix.report.id }}
          path: ${{ runner.temp }}/smoke-${{ matrix.report.id }}.json
          if-no-files-found: ignore

  # One comment on the PR saying what is left to fix, so the next push can be aimed at it.
  report:
    needs: [build, smoke]
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || inputs.pr != '')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: smoke-*
          path: ${{ runner.temp }}/smoke
          merge-multiple: true
      - name: Comment the gate result on the PR
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          RESULT: ${{ needs.smoke.result }}
        run: |
          set -uo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "not a PR number: $PR" >&2; exit 1; }
          files=("$RUNNER_TEMP"/smoke/*.json)
          marker="<!-- pin-compat -->"
          {
            echo "$marker"
            if [ "$RESULT" = success ]; then
              echo "### pin-compat: the code fits the new stack"
            else
              echo "### pin-compat: changes needed on this branch"
            fi
            echo
            if [ -e "${files[0]}" ]; then python3 -I scripts/blis_pin.py smoke-summary "${files[@]}"; fi
            echo
            echo "_Commit ${GITHUB_SHA::10}, [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Push fixes to this branch; the gate re-runs and this comment updates. Regeneration starts only after merge._"
          } > /tmp/comment.md
          # Edit OUR comment, found by its marker: --edit-last would take the token user's latest
          # comment, which for github-actions[bot] is the pages.yml preview link.
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@/tmp/comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file /tmp/comment.md
          fi

  # The ONE check to mark required. It always runs, so it always reports.
  gate:
    needs: [changed, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass when no pin moved, or every compatibility check passed
        env:
          MOVED: ${{ needs.changed.outputs.moved }}
          CHANGED: ${{ needs.changed.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          RUN: ${{ needs.changed.outputs.run }}
          REPORTS: ${{ needs.changed.outputs.reports }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "changed=$CHANGED moved=$MOVED build=$BUILD smoke=$SMOKE"
          [ "$CHANGED" = success ] || { echo "could not tell whether a pin moved"; exit 1; }
          if [ "$RUN" != true ]; then echo "no pin moved and no spec, report or runner script the smoke reads changed -- nothing to check"; exit 0; fi
          if [ "$FORK" = true ]; then
            [ "$MOVED" != true ] && { echo "a fork's change runs no smoke here; a maintainer re-runs it from a branch"; exit 0; }
            echo "a pin move from a fork is not run here -- push the branch to this repo"; exit 1; fi
          # smoke is skipped (not failed) only when there is no committed report to re-run.
          [ "$SMOKE" = skipped ] && [ "$REPORTS" = "[]" ] && SMOKE=success
          [ "$BUILD" = success ] && [ "$SMOKE" = success ] || {
            echo "the code does not fit the new stack yet -- see the failed jobs above"; exit 1; }
