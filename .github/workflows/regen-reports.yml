name: regen-reports

# Re-runs committed reports from their own specs against the pins of one branch. Two ways in:
#
#   dispatch with base=<pin PR branch>
#     every job sweeps that branch's pins, and each batch is COMMITTED onto the branch, so the pin
#     PR carries its regenerated reports. A push by GITHUB_TOKEN starts no workflow: push to the
#     branch, or re-run its checks, before review.
#   push to main moving pins.env
#     regenerates only the STALE reports (blis_pin.py stale) and opens one PR per batch. After a
#     pin PR that carried its reports merges, none is stale, so the run plans nothing.
#
#     -> plan     classify every reports/<id>/ (experiment spec | orphan), batch by model
#     -> build    the pinned simulator, once, shared by every report job; validates every spec
#                 against it so a pin that skipped the gate cannot start a campaign
#     -> regen    ONE JOB PER REPORT (matrix): a report is hours of BLIS, so each gets its own
#                 runner and its own timeout, and one failure costs one report, not the campaign
#     -> pr       per batch: a commit on the pin branch, or a PR with a before/after table on
#                 main; a failed report is listed as "not regenerated", never left stale silently
#
# Like run-experiment.yml it needs no approval gate and no secrets: the sweeper is LLM-free and
# deterministic at a fixed seed, and nothing publishes until a human merges a batch PR.
#
# Sizing, via repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   REGEN_RUNS_ON          JSON runner label(s), default "ubuntu-latest". The 64-GPU AgentX replays
#                          peak above 20 GiB RSS; a hosted runner has 16 GiB, and a cgroup that is
#                          too small never OOM-kills -- it stalls in direct reclaim until the
#                          timeout. Point this at a larger or self-hosted runner, e.g. the
#                          ARC scale set in deploy/openshift/arc/: "blis-bigmem".
#   REGEN_TIMEOUT_MINUTES  per-report job timeout, default 350 (hosted runners cap at 360).
#   REGEN_MAX_PARALLEL     report jobs at once, default 16 (the ARC scale set's maxRunners).
#   SWEEP_MAX_PARALLEL     BLIS runs at once inside one job, default 1. Each run needs its own
#                          ~25 GiB on a 64-GPU replay, so raise it only on blis-bigmem (sized for 8).
#                          The dispatch input sweep_max_parallel overrides it for one run: a GB200
#                          AgentX run peaks at ~26 GiB, and at 8 its runner pod was lost twice.
#   REGEN_RUN_TIMEOUT      per-BLIS-run timeout in seconds, default 1800.
#
# Token: as in bump-blis-pin.yml, each batch PR dispatches its own CI unless PIN_BOT_TOKEN is set.

on:
  push:
    branches: [main]
    paths: ["pins.env"]
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated report ids to regenerate (blank = every committed report)"
        required: false
      force:
        description: "regenerate every report, even those the pins already priced (off: only the stale ones, when a pin moved against the default branch)"
        type: boolean
        default: true
      sweep_max_parallel:
        description: "BLIS runs at once inside one report job (blank = vars.SWEEP_MAX_PARALLEL). Lower it for a report whose runs need more memory than the runner gives 8 of"
        required: false
      base:
        description: "branch whose pins to sweep (blank = the default branch). Another branch, such as a pin PR's, gets the regenerated reports committed onto it instead of batch PRs"
        required: false

permissions:
  contents: read

concurrency:
  group: regen-reports
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      run: ${{ steps.plan.outputs.run }}
      reports: ${{ steps.plan.outputs.reports }}
      merges: ${{ steps.plan.outputs.merges }}
      batches: ${{ steps.plan.outputs.batches }}
      blis_ref: ${{ steps.plan.outputs.blis_ref }}
    steps:
      # The base's pins, not the dispatch ref's: a run dispatched on main for a pin branch must
      # sweep the branch's stack. Every later job checks out the commit this one swept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, ref: "${{ github.event.inputs.base || github.ref }}" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - name: Did a stack pin move, and what is there to regenerate?
        id: plan
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PARALLEL: ${{ github.event.inputs.sweep_max_parallel || vars.SWEEP_MAX_PARALLEL || '1' }}
          TIMEOUT_MIN: ${{ vars.REGEN_TIMEOUT_MINUTES || '350' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          stale=""
          # A comment-only edit to pins.env matches the `paths` filter but moves no pin, and
          # must not queue hours of sweeps; compare VALUES, not bytes. Against the commit before
          # the PUSH, not HEAD^: a rebase-merged pin PR ends in its fix commits, not the bump.
          if [ "${FORCE:-false}" != "true" ]; then
            old="HEAD^"
            if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then old="$BEFORE"; fi
            # A dispatch for a pin branch compares the branch's pins with the default branch's.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then old="origin/$DEFAULT_BRANCH"; fi
            git show "$old:pins.env" > /tmp/old-pins.env
            moved="$(python3 -I scripts/blis_pin.py changed /tmp/old-pins.env)"
            echo "moved: $moved"
            if [ "$moved" = "{}" ]; then
              echo "no stack pin changed -- nothing to regenerate"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Only what the new pins did not price: a merged pin PR brought its reports with it.
            stale="--stale-only"
          fi
          # A report whose BLIS time will not fit one job runs as several shards (80% of the job timeout each).
          python3 -I scripts/blis_pin.py plan --only "${ONLY:-}" $stale \
            --max-parallel "$PARALLEL" --budget-s "$(( TIMEOUT_MIN * 60 * 8 / 10 ))" > /tmp/plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open("/tmp/plan.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if plan['reports'] else 'false'}\n")
              jobs = [{"id": r["id"], "replay": r["replay"],
                       "shard": f"{i}/{r['shards']}" if r["shards"] > 1 else "",
                       "key": f"{r['id']}--shard-{i}" if r["shards"] > 1 else r["id"]}
                      for r in plan["reports"] for i in range(r["shards"])]
              out.write("reports=" + json.dumps(jobs) + "\n")
              out.write("merges=" + json.dumps([{"id": r["id"], "replay": r["replay"], "shards": r["shards"]}
                                                for r in plan["reports"] if r["shards"] > 1]) + "\n")
              out.write("batches=" + json.dumps(plan["batches"]) + "\n")
          for b in plan["batches"]:
              print(f"batch {b['name']}: {', '.join(b['ids'])}")
          for r in plan["reports"]:
              if r["shards"] > 1:
                  print(f"{r['id']}: {r['shards']} shards")
          if not plan["reports"]:
              print("every report is already priced by the pinned stack -- nothing to regenerate")
          for p in plan.get("pending", []):
              print(f"::notice::{p['id']} is stale but its regeneration is pending elsewhere: {p['why']}")
          for p in plan.get("lapsed", []):
              print(f"::warning::{p['id']} carries a REGENERATION_PENDING marker that no longer holds "
                    f"(its release is pinned, or it names none); planned as stale. Marker: {p['why']}")
          for o in plan["orphans"]:
              print(f"::warning::{o['id']} has no experiment spec to regenerate from; "
                    f"it keeps its old stack label until handled by hand")
          PY
          set -a; . ./pins.env; set +a
          echo "blis_ref=$BLIS_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.REGEN_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - name: Clone the pinned simulator
        run: |
          set -euo pipefail
          set -a; . ./pins.env; set +a
          # BLIS_REF is a commit (the M3.2 stack head) or a release tag; a tag peels to its commit on checkout.
          git init -q upstream
          git -C upstream remote add origin https://github.com/inference-sim/inference-sim.git
          git -C upstream fetch -q --depth 1 origin "$BLIS_REF"
          git -C upstream checkout -q FETCH_HEAD
          # The tag is not immutable upstream; refuse to build a moved tag (same check as SETUP.md).
          test "$(git -C upstream rev-parse HEAD)" = "$BLIS_SHA" || {
            echo "$BLIS_REF no longer resolves to $BLIS_SHA -- aborting" >&2; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: upstream/go.mod, cache-dependency-path: upstream/go.sum }
      - run: sh scripts/build_blis.sh upstream
      # Belt and braces for a pins.env that reached main without the pin-compat gate (a direct
      # push, an admin merge): hours of runs on specs that do not fit the stack would
      # produce reports that are wrong in ways a reviewer cannot see. Seconds, so always run it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      - name: Refuse to regenerate on specs the stack does not accept
        run: python3 -I scripts/validate_experiment.py experiments/ --blis upstream/blis --fields "$RUNNER_TEMP/fields.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blis
          path: upstream/blis
          retention-days: 7

  regen:
    needs: [plan, build]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ fromJSON(vars.REGEN_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: ${{ fromJSON(vars.REGEN_TIMEOUT_MINUTES || '350') }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.REGEN_MAX_PARALLEL || '16') }}
      matrix:
        report: ${{ fromJSON(needs.plan.outputs.reports) }}
    name: regen ${{ matrix.report.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: blis, path: .build }
      - name: Check out the pinned substrate/ (the files the scripts read; the simulator uses its embedded data)
        id: stack
        run: |
          set -euo pipefail
          chmod +x .build/blis
          set -a; . ./pins.env; set +a
          # Inside the checkout, as run-experiment.yml does, so no runner path reaches a committed report.
          sh scripts/clone_stack.sh inference-sim
          echo "blis_sha=$BLIS_SHA" >> "$GITHUB_OUTPUT"
      # The 568 MB replay corpus is pinned by the catalog, so one download per simulator pin serves
      # every replay report in the campaign. blis_pin.py digest-checks it either way.
      - name: Restore the replay corpus
        if: matrix.report.replay
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .corpus/traces.jsonl
          key: replay-corpus-${{ steps.stack.outputs.blis_sha }}
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      - name: Regenerate ${{ matrix.report.key }}
        env: { SHARD: "${{ matrix.report.shard }}" }
        run: |
          set -euo pipefail
          python3 -I scripts/blis_pin.py regen "${{ matrix.report.id }}" ${SHARD:+--shard "$SHARD"} \
            --blis .build/blis --catalog inference-sim/substrate/catalog --registry inference-sim/substrate/registry \
            --fields "$RUNNER_TEMP/fields.json" \
            --out "$RUNNER_TEMP/regen" --timeout "${{ vars.REGEN_RUN_TIMEOUT || '1800' }}" \
            --max-parallel "${{ github.event.inputs.sweep_max_parallel || vars.SWEEP_MAX_PARALLEL || '1' }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regen-${{ matrix.report.key }}
          path: ${{ runner.temp }}/regen/${{ matrix.report.id }}
          retention-days: 14
          if-no-files-found: error

  # A sharded report: assemble the whole report from its shards' ledgers. No BLIS run happens
  # here (run_experiment --runs-from), but the same --out path and inputs make the same report.
  merge:
    needs: [plan, build, regen]
    if: always() && needs.plan.outputs.run == 'true' && needs.build.result == 'success' && needs.plan.outputs.merges != '[]'
    runs-on: ${{ fromJSON(vars.REGEN_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        report: ${{ fromJSON(needs.plan.outputs.merges) }}
    name: merge ${{ matrix.report.id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: blis, path: .build }
      - name: Check out the pinned substrate/
        id: stack
        run: |
          set -euo pipefail
          chmod +x .build/blis
          set -a; . ./pins.env; set +a
          sh scripts/clone_stack.sh inference-sim
          echo "blis_sha=$BLIS_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore the replay corpus
        if: matrix.report.replay
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .corpus/traces.jsonl
          key: replay-corpus-${{ steps.stack.outputs.blis_sha }}
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      # download-artifact, not gh: the REGEN_RUNS_ON runner (the ARC image) has no gh CLI (#183).
      # A pattern puts each artifact in its own regen-<id>--shard-<i>/ directory. Only a lone
      # match is flattened, and a merge has two shards or more, so that means a shard is missing,
      # and the check below fails on it.
      - name: Download every shard's ledger
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regen-${{ matrix.report.id }}--shard-*
          path: ${{ runner.temp }}/shards
      - name: Check that every shard's ledger arrived
        env: { ID: "${{ matrix.report.id }}", N: "${{ matrix.report.shards }}" }
        run: |
          set -euo pipefail
          for i in $(seq 0 $((N - 1))); do
            test -s "$RUNNER_TEMP/shards/regen-$ID--shard-$i/runs.jsonl" || {
              echo "::error::shard $i of $N of $ID has no runs.jsonl (did its regen job fail?)"; exit 1; }
          done
      - name: Assemble ${{ matrix.report.id }} from its shards
        env: { ID: "${{ matrix.report.id }}", N: "${{ matrix.report.shards }}" }
        run: |
          set -euo pipefail
          from=(); for i in $(seq 0 $((N - 1))); do from+=(--runs-from "$RUNNER_TEMP/shards/regen-$ID--shard-$i/runs.jsonl"); done
          python3 -I scripts/blis_pin.py regen "$ID" "${from[@]}" \
            --blis .build/blis --catalog inference-sim/substrate/catalog --registry inference-sim/substrate/registry \
            --fields "$RUNNER_TEMP/fields.json" --out "$RUNNER_TEMP/regen"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regen-${{ matrix.report.id }}
          path: ${{ runner.temp }}/regen/${{ matrix.report.id }}
          retention-days: 14
          if-no-files-found: error

  pr:
    needs: [plan, build, regen, merge]
    # Run even when some report jobs failed: a batch PR lists its failures instead of vanishing.
    if: always() && needs.plan.outputs.run == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the batch branches, or the commits onto a pin branch
      pull-requests: write     # open the batch PRs
      issues: write            # create the labels (labels live in the issues API)
      actions: write           # dispatch CI on the PR when there is no PIN_BOT_TOKEN
    strategy:
      fail-fast: false
      max-parallel: 1          # each batch pushes its own branch, but serialise the gh calls
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    name: pr ${{ matrix.batch.name }}
    env:
      GH_TOKEN: ${{ secrets.PIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_BOT_TOKEN: ${{ secrets.PIN_BOT_TOKEN != '' }}
      BASE_BRANCH: ${{ github.event.inputs.base || github.event.repository.default_branch }}
      # On a branch other than the default (a pin PR's), commit onto it; on main, open batch PRs.
      COMMIT_TO_BASE: ${{ (github.event.inputs.base || github.event.repository.default_branch) != github.event.repository.default_branch }}
      SWEPT: ${{ needs.plan.outputs.sha }}
    steps:
      # The base's current tip: a campaign outlives workflow edits and other pushes. A batch
      # branch carries only reports/ changes over that tip, which GITHUB_TOKEN may push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.base || github.event.repository.default_branch }}
          fetch-depth: 0       # see what the base changed since the swept commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - name: Is the swept stack still the pinned one?
        id: stack
        run: |
          set -euo pipefail
          git show "$SWEPT:pins.env" > /tmp/swept-pins.env
          moved="$(python3 -I scripts/blis_pin.py changed /tmp/swept-pins.env)"
          if [ "$moved" = "{}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pins moved on $BASE_BRANCH during this run ($moved); re-run regen-reports for the new pins"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # gh, not download-artifact@v8: v8 flattens a lone match, but a pattern always gets per-name dirs here.
      - name: Download the regenerated reports
        if: steps.stack.outputs.current == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        # Tolerate only "nothing to download" (the swap step reports it); any other error fails here.
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'regen-*' --dir "$RUNNER_TEMP/regen-artifacts" 2>"$RUNNER_TEMP/dl.err" || {
            grep -qE 'no valid artifacts|no artifact matches' "$RUNNER_TEMP/dl.err" || { cat "$RUNNER_TEMP/dl.err" >&2; exit 1; }
          }
      - name: Swap the regenerated reports in
        id: swap
        if: steps.stack.outputs.current == 'true'
        env:
          IDS: ${{ join(matrix.batch.ids, ' ') }}
        run: |
          set -euo pipefail
          art="$RUNNER_TEMP/regen-artifacts"
          cp -r reports "$RUNNER_TEMP/old-reports"
          ok=""; failed=""; superseded=""; removed=""; stale=""
          for id in $IDS; do
            if [ ! -d "reports/$id" ]; then
              # Deleted or renamed on main during the campaign: do not resurrect it.
              removed="$removed $id"
            elif [ -f "$art/regen-$id/scenario.json" ] \
               && [ -n "$(git log -1 --format=%H "$SWEPT..HEAD" -- "reports/$id")" ]; then
              # Changed on main mid-campaign: keep main's copy (the artifact may predate a spec edit).
              if python3 -I scripts/blis_pin.py same-stack "reports/$id" "$art/regen-$id"; then
                superseded="$superseded $id"
              else
                echo "::warning::reports/$id changed on main on the old stack during the run; re-run it by hand"
                stale="$stale $id"
              fi
            elif [ -f "$art/regen-$id/scenario.json" ]; then
              # Whole-directory swap: a file the new run no longer writes must not survive.
              rm -rf "reports/$id"
              cp -r "$art/regen-$id" "reports/$id"
              ok="$ok $id"
            else
              failed="$failed $id"
            fi
          done
          ok="$(echo $ok | xargs)"; failed="$(echo $failed | xargs)"; superseded="$(echo $superseded | xargs)"
          removed="$(echo $removed | xargs)"; stale="$(echo $stale | xargs)"
          echo "regenerated: ${ok:-none}; failed: ${failed:-none}; already current on main: ${superseded:-none}"
          echo "removed on main: ${removed:-none}; changed on main on the old stack: ${stale:-none}"
          { echo "ok=$ok"; echo "failed=$failed"; echo "superseded=$superseded"
            echo "removed=$removed"; echo "stale=$stale"; } >> "$GITHUB_OUTPUT"
          [ -n "$ok" ] || [ -z "$failed" ] || { echo "::error::no report in batch ${{ matrix.batch.name }} regenerated"; exit 1; }
      - name: Build the site to validate the regenerated reports
        if: steps.swap.outputs.ok != ''
        run: python3 -I scripts/build_gallery.py --out /tmp/site-check
      - name: Open the batch PR
        if: steps.swap.outputs.ok != ''
        env:
          OK: ${{ steps.swap.outputs.ok }}
          FAILED: ${{ steps.swap.outputs.failed }}
          SUPERSEDED: ${{ steps.swap.outputs.superseded }}
          REMOVED: ${{ steps.swap.outputs.removed }}
          STALE: ${{ steps.swap.outputs.stale }}
          BATCH: ${{ matrix.batch.name }}
          BLIS_REF: ${{ needs.plan.outputs.blis_ref }}
        run: |
          set -euo pipefail
          git config user.name  "blis-config-search-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "regeneration reproduced every report in $BATCH byte-for-byte -- no PR needed"
            exit 0
          fi
          table="$(python3 -I scripts/blis_pin.py summary --old "$RUNNER_TEMP/old-reports" \
                   --new reports --failed "$(echo $FAILED | tr ' ' ',')" $OK $FAILED)"
          echo "$table" >> "$GITHUB_STEP_SUMMARY"
          kept="${SUPERSEDED:+- Kept the base copy, already re-swept on this stack during the run: $SUPERSEDED}"
          gone="${REMOVED:+- Skipped, removed from the base during the run: $REMOVED}"
          redo="${STALE:+- Not swapped, changed on the base on the old stack during the run (re-run by hand): $STALE}"
          if [ "$COMMIT_TO_BASE" = true ]; then
            # Onto the pin branch itself. Batches run one at a time, but a person may push too:
            # on a refused push, rebase (batches touch disjoint reports/<id>/) and try again.
            git commit -q -F - <<EOF
          Regenerate the $BATCH reports against inference-sim $BLIS_REF

          Produced by regen-reports.yml run $GITHUB_RUN_ID from each report's own experiment
          spec, at the pins of ${SWEPT::10}. No LLM in this path.

          $table
          $kept
          $gone
          $redo
          EOF
            for attempt in 1 2 3; do
              git push origin "HEAD:$BASE_BRANCH" && { echo "committed $BATCH onto $BASE_BRANCH"; exit 0; }
              git pull --rebase --quiet origin "$BASE_BRANCH"
            done
            echo "::error::could not push $BATCH onto $BASE_BRANCH"; exit 1
          fi
          branch="regen/${BLIS_REF}-run${GITHUB_RUN_ID}-${BATCH}"
          git checkout -b "$branch"
          git commit -m "Regenerate the $BATCH reports against inference-sim $BLIS_REF

          Produced by regen-reports.yml from each report's own experiment spec, after the pin
          move merged in ${SWEPT::10}. No LLM in this path."
          git push origin "$branch"
          cat > /tmp/body.md <<EOF
          Regenerates the **$BATCH** reports against the stack now pinned in \`pins.env\`
          (inference-sim **$BLIS_REF**, merged in ${SWEPT::10}).

          $table

          $kept
          $gone
          $redo

          Each report was re-run from its own experiment spec at its recorded seed, by the
          deterministic sweeper (no LLM). The directory is replaced whole,
          so nothing from the old run survives beside the new one.

          **Review the movement, not just the totals:** a changed winner or a large tok/s/GPU swing is
          the simulator change showing through, and is worth a sentence in the release notes. Merge
          to publish through \`pages.yml\`.

          This is one of several batch PRs from [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); each can merge on its own.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          # Labels mark a PR this automation opened: `auto-update` for every one, plus its kind.
          # --force makes creation idempotent (and keeps the colour/description current).
          gh label create auto-update --force --color 5319e7 \
            --description "Opened by the pin-bump automation, not by a person"
          gh label create report-regen --force --color 0e8a16 \
            --description "Reports regenerated against a new pinned stack"
          gh pr create --title "Regenerate $BATCH reports on inference-sim $BLIS_REF" \
            --body-file /tmp/body.md --base "${BASE_BRANCH}" --head "$branch" \
            --label auto-update --label report-regen
          # A PR opened with GITHUB_TOKEN starts no workflows, but a dispatch does: start its CI here.
          if [ "$HAS_BOT_TOKEN" != true ]; then
            pr="$(gh pr view "$branch" --json number --jq .number)"
            gh workflow run checks.yml --ref "$branch"
            gh workflow run pin-compat.yml --ref "$branch" -f base="$BASE_BRANCH" -f pr="$pr"
          fi
