# Does splitting prefill from decode pay on long-prompt traffic? Every run uses all 64 GPUs.
name: kimi-k2-5-h200-multidoc-pd

scenario:
  model: kimi-k2.5
  hardware: h200
  workload: multidoc
  gpus: 64
  slo: {itl_p99: 20ms, ttft_p99: 5s}
  concurrency: [8, 16, 32, 64, 128, 256, 512]   # closed-loop users

sweeps:
  - name: aggregated
    num-instances: [8, 16]                      # tp x dp x num-instances = 64
    parallel:
      tp: [4, 8]
      dp: [1, 2]
      enable_expert_parallel: [false, true]
    router:
      endpoint_picker_config: [routing/queue.yaml, routing/prefix-affinity.yaml]

  - name: disaggregated
    prefill-instances: [2, 3, 4]                # 8 x (prefill + decode) = 64
    decode-instances: [4, 5, 6]
    prefill:
      parallel: {tp: [8], enable_expert_parallel: [true]}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
    router:                                     # the P/D decision IS a router config
      endpoint_picker_config: [routing/pd-always.yaml, routing/pd-prefix.yaml]

  - name: pd-threshold
    prefill-instances: [3]
    decode-instances: [5]
    prefill:
      parallel: {tp: [8], enable_expert_parallel: [true]}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
    router:
      endpoint_picker_config: [routing/pd-prefix.yaml]
      plugins:
        prefix-based-pd-decider:
          parameters:
            nonCachedTokens: [16, 256, 1024, 4096]   # split only when this many prompt tokens are uncached (0 disables P/D)
