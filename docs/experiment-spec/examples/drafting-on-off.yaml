# Is speculative decoding worth it under agentic load? Same topologies, drafter off vs on.
name: deepseek-v4-1-flash-h100-agentx-drafting

scenario:
  model: deepseek-v4.1-flash
  hardware: h100
  workload: agentx-mvp
  gpus: 32
  slo: {itl_p99: 20ms}
  concurrency: [4, 8, 16, 32, 64, 128]   # session lanes: each lane fans out into many requests

sweeps:
  - name: no-drafting
    num-instances: [1, 2, 4]             # tp x dp x num-instances = 32
    parallel:
      tp: [4, 8]
      dp: [1, 2, 4, 8]
      enable_expert_parallel: [true]
    engine:
      cache_dtype: [fp8_ds_mla]
      max_model_len: [262144]

  - name: drafting
    num-instances: [1, 2, 4]
    parallel:
      tp: [4, 8]
      dp: [1, 2, 4, 8]
      enable_expert_parallel: [true]
    engine:
      cache_dtype: [fp8_ds_mla]
      max_model_len: [262144]
      speculative:
        method: [dspark]                 # the drafter the model's catalog graph declares
        num_spec_tokens: [1, 2, 3, 4, 5]
