# Best tok/s/GPU for DeepSeek-V4.1-Flash on 32 H100s under AgentX at itl_p99 20ms, and which knobs travel.
# MoE 128 experts top_k 3 -> EP, all2all, Engram placement are real; dspark K<=5; fp8_ds_mla only on SM90.
# Floors on pinned v0.15.0: EP on needs tp*dp >= 8 and tp >= 2; EP off needs tp*dp >= 16; gmu 0.7 refuses.
# Measured: deepep_low_latency refuses at TP2xDP4 (RDMA buffers), so it is not an arm; ~33s/run here.
# Not swept: block_size (set per hardware), eplb (r=32 within 0.1%), swa_bounded_replay, moe_backend,
# long_prefill_token_threshold (cost 2-12% before), P/D (warm prefix, decode-heavy). 280 runs, ~2.6h.

name: deepseek-v4-1-flash-h100-agentx-4node

scenario:
  model: deepseek-v4.1-flash
  hardware: h100
  cluster: {gpus_per_node: 8}   # an 8-GPU HGX server; the catalog fixes no node size for this chip
  workload: agentx-mvp
  gpus: 32
  slo: {itl_p99: 20ms}
  # V4.1 serves only fp8_ds_mla on SM90, and at the 32k default every AgentX trace is filtered out.
  engine: {cache_dtype: fp8_ds_mla, max_model_len: 262144}
  concurrency: [32, 64, 96, 128]   # session lanes; the 20ms knee sits between 32 and 128
  replay:
    corpus: .corpus/traces.jsonl
    corpus_cache: /tmp/agx-cache-h100
    grace_period: inf                  # 30s default misreads saturated loads as incomplete

sweeps:
  - name: topology
    # The control: every sweep below has its default twin here at the same shape and load.
    narrative: Wide TP8 instances should win at the SLO, since narrow tp pays more per-step latency than the extra replicas buy back.
    num-instances: [1, 2, 4]
    parallel: {tp: [8, 4, 2], dp: [1, 2, 4, 8], enable_expert_parallel: [true]}

  - name: ep-off
    narrative: Replicating all 128 experts should cost KV room and throughput against the EP twins in topology.
    num-instances: [2]
    parallel: {tp: [8, 4], dp: [2, 4], enable_expert_parallel: [false]}

  - name: drafting-depth
    # K=0 twins are in topology; each step verifies K+1 tokens, so depth trades tok/s against ITL.
    narrative: Deeper dspark drafts should add tok/s, but the 20ms ITL bound should cap K lower on narrow tp than on TP8.
    num-instances: [4, 1]
    parallel: {tp: [8, 4, 2], dp: [1, 2, 4], enable_expert_parallel: [true]}
    engine:
      speculative: {method: [dspark], num_spec_tokens: [1, 2, 3, 5]}

  - name: batch-caps
    # Per-rank lanes scale with 32/tp, so the seq cap should bind at TP8 long before TP2.
    narrative: max_num_seqs should bind on TP8 ranks and not on TP2, while a small token cap trades throughput for tail ITL on both.
    num-instances: [4]
    parallel: {tp: [8, 2], dp: [1, 4], enable_expert_parallel: [true]}
    engine:
      max_num_batched_tokens: [2048, 8192, 32768]
      max_num_seqs: [32, 256]

  - name: moe-collective
    # Default allgather_reducescatter twins are in topology; EP width here is 8, 16 and 32.
    narrative: Routed all-to-all backends should only pay once EP spans nodes, and hurt on narrow tp where buffers crowd KV.
    num-instances: [4, 2, 1]
    parallel: {tp: [2, 8], dp: [4, 2], enable_expert_parallel: [true]}
    engine:
      all2all_backend: [deepep_high_throughput, pplx, deepep_v2]

  - name: kv-and-engram
    # Probe at 4xTP8 c=96: Engram in HBM pushed p99 ITL to 143ms at gmu 0.9 but 11ms at 0.95.
    narrative: Moving Engram tables into HBM should only pay when gmu leaves KV room for them, and cost more on narrow tp.
    num-instances: [4]
    parallel: {tp: [8, 2], dp: [1, 4], enable_expert_parallel: [true]}
    engine:
      gpu_memory_utilization: [0.9, 0.95]
      engram_config: {cpu_offload: [true, false]}

  - name: cudagraph
    # Per-step host cost; measured not to interact with topology, so one shape.
    narrative: FULL-family capture should beat the PIECEWISE default by a few percent and NONE should collapse.
    num-instances: [4]
    parallel: {tp: [8], dp: [1], enable_expert_parallel: [true]}
    engine:
      cudagraph_mode: [NONE, FULL, FULL_AND_PIECEWISE]

  - name: routing-and-prefix-cache
    # Default-router twins (cache on) are in topology.
    narrative: prefix-affinity should only beat random with caching on, and the gap should widen from 2 to 4 instances.
    num-instances: [2, 4]
    parallel: {tp: [8, 2], dp: [2, 4], enable_expert_parallel: [true]}
    engine:
      enable_prefix_caching: [true, false]
    router:
      endpoint_picker_config: [random.yaml, load-aware.yaml, prefix-affinity.yaml]
