<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>__TITLE__</title>
<style>
:root{--bg:#fbfbfa;--panel:#fff;--ink:#14161a;--ink2:#4c535c;--ink3:#878e97;
--line:#e4e5e3;--rule:#d8d9d7;--accent:#1b4f8f;--hero:#f4f6f8;--good:#1e5c33;
--bad:#b2182b;--fig-bg:#fff;
--fig-ink:#111;--fig-ink2:#555;--fig-ink3:#8a8a8a;--fig-grid:#ececec;
--fig-grid2:#f4f4f4;--fig-axis:#333;--fig-band:#eef2f7;--fig-muted:#b9c0c8;
--fig-ok:#eaf3ec;--fig-bar2:#5b7fa6;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171b;
--panel:#1c1f24;--ink:#eceef1;--ink2:#aab1b9;--ink3:#7c838c;--line:#2b2f35;
--rule:#343940;--accent:#6ba3f0;--hero:#1f242b;--fig-bg:#1c1f24;
--fig-ink:#e8eaed;--fig-ink2:#a6adb5;--fig-ink3:#79808a;--fig-grid:#2c3036;
--fig-grid2:#262a30;--fig-axis:#6e757e;--fig-band:#232a33;--fig-muted:#4e555e;
--fig-ok:#1c2a20;--fig-bar2:#4a6a98}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
font-size:19px;line-height:1.62;text-rendering:optimizeLegibility;
-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 96px}
header{padding:64px 0 10px}
h1{font-size:46px;line-height:1.1;letter-spacing:-0.019em;margin:0 0 16px;
font-weight:600}
.standfirst{font-size:21px;line-height:1.5;color:var(--ink2);max-width:33em;
margin:0 0 6px}
.meta{font-family:var(--sans);font-size:12.5px;color:var(--ink3);
border-top:1px solid var(--rule);margin-top:30px;padding-top:11px;
display:flex;gap:22px;flex-wrap:wrap}
.meta code{font-family:var(--mono);font-size:11.5px}
section.hero{margin:34px 0 8px}
.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--hero);
border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pcell{padding:22px 24px 20px;border-right:1px solid var(--line)}
.pcell:last-child{border-right:0}
.pcell h4{font-family:var(--sans);font-size:11px;letter-spacing:0.1em;
text-transform:uppercase;color:var(--ink3);margin:0 0 9px;font-weight:700}
.pcell p{margin:0;font-size:16.5px;line-height:1.52}
.pcell.run{background:color-mix(in srgb,var(--accent) 7%,var(--hero))}
section.finding{margin:62px 0 0;padding-top:30px;border-top:1px solid var(--rule)}
section.finding h2{font-size:31px;line-height:1.2;letter-spacing:-0.014em;
margin:0 0 26px;font-weight:600;display:flex;gap:15px;align-items:baseline}
h2 .num{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--accent);
border:1.5px solid var(--accent);border-radius:50%;width:27px;height:27px;
display:inline-flex;align-items:center;justify-content:center;flex:none;
transform:translateY(-3px)}
figure{margin:0 0 26px}
.figwrap{background:var(--fig-bg);border:1px solid var(--line);border-radius:3px;
padding:14px 12px 8px}
.figwrap svg{width:100%;height:auto;display:block}
.fig-missing{font-family:var(--sans);font-size:13.5px;color:var(--ink3);
padding:46px 18px;text-align:center}
figcaption{font-family:var(--sans);font-size:13.5px;line-height:1.58;
color:var(--ink2);margin-top:11px;max-width:60em}
figcaption b{color:var(--ink)}
.prose{max-width:34em}
.prose p{margin:0 0 17px}
.prose p:last-child{margin-bottom:0}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13.5px;
margin:22px 0 0}
th{text-align:left;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
color:var(--ink3);font-weight:700;border-bottom:1.5px solid var(--rule);
padding:0 12px 7px;vertical-align:bottom}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.hero{font-size:19px;font-weight:700;color:var(--accent)}
/* The "What to run" configuration cell. Mirrors the dashboard's .op-name/.op-var/.op-flags
   (web/src/styles.css) so one row reads the same on both surfaces: the topology, its knob delta,
   then the flags FLOWING rather than one per line -- stacked, eleven flags made a row tall
   enough to push the next load off the screen. */
/* "nothing held the floor" -- the report's twin of the dashboard's .op-none (web/src/styles.css),
   so the empty case reads as a finding on both surfaces rather than a missing table. */
.op-none{margin:14px 0 0;font-size:13px;color:var(--ink2);border-left:2px solid var(--rule);
padding:8px 0 8px 12px}
.short .op-name{font-size:12.5px;font-weight:700;color:var(--ink)}
.short .op-var{font-size:11px;color:var(--accent);margin-top:1px}
.short td>.op-name+.fl,.short td>.op-var+.fl{margin-top:4px}
.short .fl{display:inline-block;font-family:var(--mono);font-size:11.5px;
color:var(--ink);white-space:nowrap;line-height:1.7;margin-right:9px}
.short .fl i{color:var(--ink3);font-style:normal}
#xf{margin-top:20px}
/* The explorer is two-part, as in the reference report: brush a RANGE on an outcome metric
   (.xf-hist row) or click a LEVEL of a deployment knob (.xf-bar). Both drive one selection. */
.xf-head{font-family:var(--sans);font-size:10.5px;letter-spacing:0.08em;
text-transform:uppercase;color:var(--ink3);margin:18px 0 7px;font-weight:700}
.xf-head span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)}
.xf-hist{display:grid;
grid-template-columns:repeat(auto-fit,minmax(176px,1fr));
gap:10px 16px;align-items:start;
background:var(--panel);border:1px solid var(--line);border-radius:4px;
padding:14px 18px}
.xf-h{min-width:0}
.xf-h h6{font-family:var(--sans);font-size:11px;color:var(--ink2);margin:0 0 2px;
font-weight:600;display:flex;justify-content:space-between;gap:8px}
.xf-h h6 b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
.xf-h h6 b.off{color:var(--ink3);font-weight:400}
.xf-h svg{display:block;width:100%;height:58px;overflow:visible}
.xf-h .bar{fill:var(--fig-bar2);opacity:.5}
.xf-h .bar.sel{opacity:1}
.xf-h .selection{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);
stroke-width:1;shape-rendering:crispEdges}
.xf-h .handle{fill:var(--accent);fill-opacity:.55;stroke:none}
.xf-h .axlab{font-family:var(--sans);font-size:9.5px;fill:var(--ink3)}
.xf-bar{background:var(--panel);border:1px solid var(--line);border-radius:4px;
padding:4px 18px 16px}
/* "show N more filters" disclosure, between the primary facets and the detail block */
.xf-more{padding-top:13px;border-top:1px solid var(--line);margin-top:6px}
.xf-more button{font-family:var(--sans);font-size:11.5px;color:var(--accent);cursor:pointer;
background:none;border:0;padding:3px 0;text-align:left}
.xf-more button span{color:var(--ink3)}
.xf-more button:hover{text-decoration:underline}
.xf-detail{display:none}
.xf-detail.show{display:block}
/* a facet GROUP (Load / Topology / Routing / Engine) */
.xf-grp{padding-top:13px}
.xf-grp + .xf-grp{border-top:1px solid var(--line);margin-top:4px}
.xf-grp h4{font-family:var(--sans);font-size:9.5px;letter-spacing:0.1em;
text-transform:uppercase;color:var(--accent);margin:0 0 9px;font-weight:700;opacity:.85}
/* Flex, not grid. `repeat(auto-fit, minmax(118px,1fr))` created a track per POSSIBLE facet and
   left the unused ones as 0px columns that still sized the row — a 2-facet group measured 180px
   tall for 78px of content. Flex wrapping gives each facet its content height and packs the row. */
.xf-grid-dims{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start}
/* NB: declare .xf-dim's own rules BEFORE the layout ones. A later `.xf-dim{min-width:0}` has the
   same specificity as `.xf-grid-dims > .xf-dim` on that property and silently won, collapsing
   every facet to zero width. */
.xf-dim{min-width:0}
.xf-grid-dims > .xf-dim{flex:1 1 118px;max-width:100%;min-width:118px;align-self:flex-start}
/* a wrapping facet (many short levels) earns more width so its options form few rows */
.xf-grid-dims > .xf-dim.xf-flow{flex:3 1 320px;min-width:260px}
/* facets whose levels are PHRASES ("batch tokens 2,048", "64x TP2xDP4 + EP") need room, or every
   level wraps mid-phrase and becomes hard to read next to the numeric facets */
.xf-grid-dims > .xf-dim.xf-wide{flex:2 1 230px;min-width:200px}
/* the options holder is a block inside the flex ITEM, not a flex child of the row */
.xf-grid-dims > .xf-dim > div{width:100%}
/* A facet with many short numeric levels ("sessions" has a dozen) would run one option per row
   and cost a screen of scroll before the real knobs. Opt those into a wrapping flow instead,
   driven by a class rather than :only-child — the latter silently stopped matching the moment a
   second facet joined the group.
   The class is `xf-flow`, NOT `wrap`: `.wrap` is the page's own container class
   (`padding: 0 28px 96px`), so a facet carrying it inherited 96px of bottom padding and measured
   181px tall for 78px of content. */
.xf-dim.xf-flow > div{display:flex;flex-wrap:wrap;gap:0 6px}
.xf-dim.xf-flow .xf-opt{flex:0 0 auto;min-width:58px}
.xf-dim h5{font-family:var(--sans);font-size:10.5px;letter-spacing:0.08em;
text-transform:uppercase;color:var(--ink3);margin:0 0 7px;font-weight:700}
.xf-opt{font-family:var(--sans);font-size:12.5px;padding:3px 7px;margin:0 0 2px;
border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;
gap:10px;user-select:none;border:1px solid transparent}
.xf-opt:hover{background:var(--hero)}
.xf-opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* an option with no runs under the current filters: dimmed, not clickable */
.xf-opt.empty{opacity:.32;cursor:not-allowed}
.xf-opt.empty:hover{background:none}
.xf-opt .c{font-variant-numeric:tabular-nums;opacity:.72;font-size:11.5px}
/* empty-state banner shown over the scatter/table when a selection matches no runs */
.xf-none{font-family:var(--sans);font-size:13px;color:var(--ink2);
background:var(--hero);border:1px solid var(--line);border-radius:4px;
padding:12px 14px;margin-top:14px;display:none}
.xf-none.show{display:block}
.xf-none b{color:var(--ink)}
.xf-sum{font-family:var(--sans);font-size:13.5px;color:var(--ink2);
margin:16px 0 4px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;
justify-content:space-between}
.xf-sum>span{flex:1 1 auto}
.xf-sum b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.xf-clear{font-family:var(--sans);font-size:12px;color:var(--accent);cursor:pointer;
border:1px solid var(--accent);border-radius:3px;padding:3px 10px;background:none}
/* y-axis view switcher: segmented control over the latency/throughput metrics */
.xf-views{display:flex;gap:0;flex-wrap:wrap;margin:14px 0 0;
font-family:var(--sans);font-size:12px}
.xf-views .lb{color:var(--ink3);font-size:10.5px;letter-spacing:0.08em;
text-transform:uppercase;font-weight:700;align-self:center;margin-right:10px}
.xf-view{padding:4px 11px;border:1px solid var(--line-strong,var(--rule));cursor:pointer;
background:var(--panel);color:var(--ink2);user-select:none;margin-left:-1px}
.xf-view:first-of-type{border-radius:3px 0 0 3px;margin-left:0}
.xf-view:last-child{border-radius:0 3px 3px 0}
.xf-view:hover{background:var(--hero);color:var(--ink)}
.xf-view.on{background:var(--accent);border-color:var(--accent);color:#fff;z-index:1}
.xf-view .u{opacity:.66;font-size:10.5px;margin-left:5px}
#xf-scatter{background:var(--fig-bg);border:1px solid var(--line);border-radius:3px;
margin-top:10px}
#xf-scatter g.p{cursor:pointer}
#xf-scatter g.p.sel circle{stroke:var(--ink);stroke-width:2.4}
/* hover card — replaces the browser's unstyled SVG <title> tooltip */
.xf-tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .09s;
background:var(--panel);border:1px solid var(--rule);border-radius:5px;
box-shadow:0 6px 24px rgba(0,0,0,.17);padding:9px 11px;max-width:290px;
font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--ink2)}
.xf-tip.show{opacity:1}
.xf-tip h6{font-family:var(--mono);font-size:12px;color:var(--ink);margin:0 0 5px;
font-weight:600;letter-spacing:-0.01em}
/* the knob delta from this topology's baseline, spelled out ("batch tokens 2,048") */
.xf-tip .var{font-size:11px;color:var(--accent);margin:-3px 0 6px}
.xf-tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0}
.xf-tip dt{color:var(--ink3)}
.xf-tip dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.xf-tip .bad{color:var(--bad);margin:5px 0 0;font-size:11.5px}
.xf-tip .cta{color:var(--ink3);font-size:11px;margin:6px 0 0;font-style:italic}
/* click-to-inspect panel: the exact deployment BLIS consumed */
.xf-panel{display:none;margin-top:12px;background:var(--panel);
border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.xf-panel.show{display:block}
.xf-panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.xf-panel .ph h5{font-family:var(--mono);font-size:14px;margin:0;color:var(--ink);
font-weight:600}
.xf-panel .ph .x{font-family:var(--sans);font-size:11.5px;color:var(--accent);
cursor:pointer;border:1px solid var(--accent);border-radius:3px;padding:2px 9px;
background:none;flex:none}
.xf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px 20px}
.xf-grid section{min-width:0}
.xf-grid h6{font-family:var(--sans);font-size:10px;letter-spacing:0.08em;
text-transform:uppercase;color:var(--ink3);margin:0 0 6px;font-weight:700}
.xf-grid dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;
font-family:var(--sans);font-size:12px}
.xf-grid dt{color:var(--ink3);white-space:nowrap}
.xf-grid dd{margin:0;text-align:right;color:var(--ink);font-family:var(--mono);
font-size:11.5px;font-variant-numeric:tabular-nums}
.xf-cmd{margin-top:14px}
.xf-cmd pre{background:var(--hero);border:1px solid var(--line);border-radius:3px;
padding:10px 12px;margin:0;overflow-x:auto;font-family:var(--mono);font-size:11px;
line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-all}
.xf-cmd .none{font-family:var(--sans);font-size:11.5px;color:var(--ink3);font-style:italic}
#xf-table{max-height:460px;overflow:auto;margin-top:6px;border:1px solid var(--line);
border-radius:3px}
#xf-table table{margin:0}
#xf-table th{position:sticky;top:0;background:var(--panel);z-index:2;
padding:9px 11px 7px}
#xf-table td{padding:8px 11px;font-size:12.5px}
tr.bad td{color:var(--bad)}
tr.bad td:first-child::before{content:"\2715\00a0";font-size:10px}
/* Glossary links: a dotted underline on first use, a definition on hover or focus.
   The tooltip is CSS-only so it works with JavaScript disabled and in print. */
a.gl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3);
cursor:help;position:relative}
a.gl:hover,a.gl:focus{border-bottom-color:var(--accent);color:var(--accent);
outline:none}
a.gl::after{content:attr(data-def);position:absolute;left:0;top:calc(100% + 9px);
width:max(260px,22em);background:var(--panel);color:var(--ink);
border:1px solid var(--rule);border-radius:5px;padding:9px 12px;
font-family:var(--sans);font-size:13px;line-height:1.45;font-style:normal;
box-shadow:0 7px 24px rgba(0,0,0,.16);opacity:0;visibility:hidden;
transition:opacity .13s ease .05s;z-index:40;pointer-events:none;
text-align:left;font-weight:400}
a.gl::before{content:"";position:absolute;left:14px;top:calc(100% + 3px);
border:6px solid transparent;border-bottom-color:var(--rule);opacity:0;
visibility:hidden;transition:opacity .13s ease .05s;z-index:41}
a.gl:hover::after,a.gl:focus::after,a.gl:hover::before,a.gl:focus::before{
opacity:1;visibility:visible}
.gl-list{margin:18px 0 0;padding:0;columns:2;column-gap:40px}
.gl-entry{break-inside:avoid;margin:0 0 15px;padding:0}
.gl-entry dt{font-family:var(--sans);font-size:13.5px;font-weight:700;
color:var(--ink);margin:0 0 3px;scroll-margin-top:24px}
.gl-entry dd{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.gl-entry dd b{color:var(--ink);font-weight:600}
.gl-entry dd code{font-family:var(--mono);font-size:12px;
background:var(--hero);padding:1px 4px;border-radius:3px}
.gl-entry:target dt{color:var(--accent)}
.gl-entry:target{background:var(--hero);border-radius:4px;
box-shadow:0 0 0 10px var(--hero)}
.gl-unused{display:none}
@media (max-width:900px){.gl-list{columns:1}
a.gl::after{width:min(84vw,22em)}}
@media print{a.gl::after,a.gl::before{display:none}
a.gl{border-bottom:none}}
.foot{margin-top:58px;padding-top:18px;border-top:1px solid var(--rule);
font-family:var(--sans);font-size:13px;color:var(--ink2);max-width:52em}
.foot a{color:var(--accent)}
svg text{font-family:var(--sans)}
@media (max-width:900px){
  body{font-size:17.5px} h1{font-size:34px} section.finding h2{font-size:25px}
  .panel{grid-template-columns:1fr}
  .pcell{border-right:0;border-bottom:1px solid var(--line)}
  .wrap{padding:0 18px 70px}
}
@media print{
  body{background:#fff} .xf-bar,.xf-hist,#xf-table{break-inside:avoid}
  section.finding{break-inside:avoid-page}
}

<!-- report.py renders the entire article body (header, hero, sections, glossary, footer) here -->
__BODY__
</div>

<!-- d3 + crossfilter power ONLY the §1 interactive explorer. They are INLINED here (report.py splices
     report/vendor/*.min.js) rather than loaded from a CDN, so the report is fully self-contained and
     the explorer works offline with nothing installed. The article and all baked inline-SVG figures
     need no JS at all; the explorer additionally guards on `typeof d3 === "undefined"` so even a
     stripped vendor block degrades to the static article rather than erroring. -->
__VENDOR_JS__
<script>
const RECORDS = /*__RECORDS__*/[];
const FACTS = /*__FACTS__*/{};
// The shared vocabulary (report/lexicon.json), baked in by report.py. The React dashboard reads
// the same file, so a facet, a metric or an axis is named identically on both surfaces -- the
// drift issue #13 is about. `lab()` is the one lookup both namespaces go through.
const LEX = /*__LEXICON__*/{};
const lab = k => (LEX.metrics && LEX.metrics[k] ? LEX.metrics[k].label
                  : (LEX.facets && LEX.facets[k] ? LEX.facets[k].label : k));
const ax = k => (LEX.axes && LEX.axes[k]) || '';

// Cross-filtered explorer over the same records that produced every figure.
// Crossfilter holds the dimensions; d3 renders. Clicking a value filters every
// other dimension's counts, the scatter, and the table at once. (Ported from the
// CurveBender/granite "glm53flash" report; mounts only if #xf and d3 are present.)
(function(){
  if (typeof d3 === "undefined" || typeof crossfilter === "undefined") return;
  if (!document.getElementById("xf") || !RECORDS.length) return;

  // Only surface knobs that actually vary -- a dimension with one value is noise here.
  // epw/dp/a2a are the MoE axes the search now explores (expert-parallel width is derived as
  // tp x dp); they auto-hide on a dense run set, where they are constant.
  // PROGRESSIVE DISCLOSURE. `primary` is what dominates an LLM serving decision — the GPU count,
  // how the model is sharded (TP / DP / EP), how many replicas, and the load — so those facets
  // are always visible. `detail` is the engine and routing knobs: real levers (routing swung
  // throughput 2.3x) but second-order, and showing all of them at once turned the panel into a
  // wall of knobs. They sit behind "more filters".
  // Every `label` is lab(key) -- the shared lexicon's name for that facet, which the dashboard's
  // FACETS list reads from the same file. A facet is never renamed in one place only.
  const num=(a,b)=>a-b;
  const ALL_DIMS = [
    {key:'conc', order:num,  grp:'Load',       tier:'primary'},
    // `series` is the topology; `variant` is its knob delta. Both are primary: once the search
    // refines knobs, several runs legitimately share a series name, and the variant facet is how
    // you tell those apart without hunting through the table.
    {key:'series',order:null, grp:'Topology',   tier:'primary'},
    {key:'variant',order:null,grp:'Topology',   tier:'primary'},
    {key:'gpus', order:num,  grp:'Topology',   tier:'primary'},
    {key:'tp',   order:num,  grp:'Topology',   tier:'primary'},
    {key:'dp',   order:num,  grp:'Topology',   tier:'primary'},
    {key:'epw',  order:num,  grp:'Topology',   tier:'primary'},
    {key:'ni',   order:num,  grp:'Topology',   tier:'primary'},
    {key:'ok',   order:null, grp:'Load',       tier:'primary'},
    {key:'nodes',order:num,  grp:'Topology',   tier:'detail'},
    {key:'pd',   order:null, grp:'Topology',   tier:'detail'},
    {key:'route',order:null, grp:'Routing',    tier:'detail'},
    {key:'scorers',order:null,grp:'Routing',   tier:'detail'},
    {key:'schedp',order:null,grp:'Routing',    tier:'detail'},
    {key:'admit',order:null, grp:'Routing',    tier:'detail'},
    {key:'a2a',  order:null, grp:'Engine',     tier:'detail'},
    {key:'mnbt', order:num,  grp:'Engine',     tier:'detail'},
    {key:'mns',  order:num,  grp:'Engine',     tier:'detail'},
    {key:'bs',   order:num,  grp:'Engine',     tier:'detail'},
    {key:'gmu',  order:num,  grp:'Engine',     tier:'detail'},
    {key:'mtp',  order:num,  grp:'Engine',     tier:'detail'},
  ].map(d=>({...d, label:lab(d.key)}));
  // Y-axis views for the scatter. EVERY latency metric here is p99 — the basis the interactivity
  // floor uses — so switching the axis never swaps a mean for a tail under the reader.
  // TPOT is not a fifth view: time-per-output-token IS the inter-token latency, so it is named on
  // the ITL view rather than offered as a separate (identical) axis.
  // label/unit/note all come from the lexicon entry for the key (the `help` line is the note), so
  // the y-axis of this scatter reads exactly like the dashboard's column for the same metric.
  const VIEWS = [
    {key:'pu',   short:'per user', log:false, hi:true},
    {key:'itl',  short:'TPOT',     log:false, hi:false},
    {key:'ttft', short:'TTFT',     log:true,  hi:false},
    {key:'e2e',  short:'E2E',      log:true,  hi:false},
    {key:'sched',short:'queue',    log:true,  hi:false},
  ].map(v=>({...v, label:lab(v.key), unit:LEX.metrics[v.key].unit,
             note:LEX.metrics[v.key].help}));
  // Continuous outcome metrics, brushed as a RANGE rather than clicked as a level. These are the
  // reference report's "filter by outcome" row; `log` for the heavy-tailed latency axes.
  const ALL_HISTS = [
    {key:'pu',   log:false},
    {key:'tpg',  log:false},
    {key:'ttft', log:true},
    {key:'itl',  log:false},
    {key:'sched',log:true},
  ].map(h=>({...h, label:lab(h.key), unit:LEX.metrics[h.key].unit}));
  // Level labels for facet values that do not read as themselves. crossfilter groups null as its
  // own level, so epw (null on every EP-off run) rendered a BLANK clickable row with a count --
  // a filter you could not read. '' is the key for null/undefined after String().
  const LEVEL_LABELS = {
    epw: {'':'off', 'null':'off', 'undefined':'off'},
    ok:  {'true':'yes', 'false':'no'},
    a2a: {'n/a':'EP off', 'ep':'expert-parallel'},
    // an empty variant means "every knob at its default" — say so rather than show a blank row
    variant: {'':'all defaults', 'null':'all defaults', 'undefined':'all defaults'},
  };
  const levelLabel = (key, raw) => {
    const k = raw===null||raw===undefined ? '' : String(raw);
    const tbl = LEVEL_LABELS[key];
    if (tbl && tbl[k]!==undefined) return tbl[k];
    if (k==='') return 'n/a';                       // any other null level still gets a name
    return key==='mnbt' ? d3.format(',')(+k) : k;
  };
  const varies = k => new Set(RECORDS.map(r=>r[k])).size > 1;
  const DIMS = ALL_DIMS.filter(d => d.key==='conc' || d.key==='ok' || varies(d.key));
  // A histogram needs at least two distinct NUMERIC values to have a range worth brushing.
  const nums = k => RECORDS.map(r=>r[k]).filter(v=>typeof v==='number' && isFinite(v));
  const HISTS = ALL_HISTS.filter(h => new Set(nums(h.key)).size > 1);

  const cf = crossfilter(RECORDS);
  const dims={}, groups={}, sel={};
  DIMS.forEach(d=>{ dims[d.key]=cf.dimension(r=>r[d.key]); groups[d.key]=dims[d.key].group();
    sel[d.key]=new Set(); });
  // Each brushed metric gets its own crossfilter dimension and an active [lo,hi] range (null =
  // unbrushed). A null metric never satisfies a range, so brushing excludes unmeasured runs --
  // which is correct: you cannot select on an outcome that was not measured.
  const hdims={}, hrange={};
  HISTS.forEach(h=>{ hdims[h.key]=cf.dimension(r=>r[h.key]); hrange[h.key]=null; });

  const root=d3.select('#xf');
  root.append('div').attr('class','xf-head')
    .html('Filter by outcome: brush a range &nbsp;<span>— drag across a chart; click it to clear</span>');
  const histWrap=root.append('div').attr('class','xf-hist');
  root.append('div').attr('class','xf-head')
    .html('Filter by setting: click a level &nbsp;<span>— counts update against every other filter</span>');
  // Primary facets always; detail facets inside a collapsed block. Groups with no surviving
  // dimension are skipped, so a search that swept no engine knobs shows no "Engine" block (and
  // no disclosure at all).
  const GRP_ORDER=['Load','Topology','Routing','Engine'];
  const groupsOf=tier=>GRP_ORDER
    .map(g=>({name:g, dims:DIMS.filter(d=>d.grp===g && d.tier===tier)}))
    .filter(g=>g.dims.length);
  const PRIMARY=groupsOf('primary'), DETAIL=groupsOf('detail');
  const nDetail=DETAIL.reduce((n,g)=>n+g.dims.length,0);

  const bar=root.append('div').attr('class','xf-bar');
  const renderGroups=(host,grps)=>{
    const els=host.selectAll('div.xf-grp').data(grps).join('div').attr('class','xf-grp');
    els.append('h4').text(d=>d.name);
    const p=els.append('div').attr('class','xf-grid-dims')
      .selectAll('div.xf-dim').data(d=>d.dims).join('div')
      // A facet with many short levels wraps horizontally instead of one option per row.
      .attr('class',d=>'xf-dim'
        + (new Set(RECORDS.map(r=>r[d.key])).size > 6 ? ' xf-flow' : '')
        // phrase-valued facets get extra width (see .xf-wide)
        + (['series','variant','scorers','route'].includes(d.key) ? ' xf-wide' : ''));
    p.append('h5').text(d=>d.label);
    // Each panel's own option holder, bound to its dim — redraw() walks optHolders, so a panel
    // in a collapsed tier is still updated and its filter still counts.
    p.each(function(d){ optHolders.push({dim:d, sel:d3.select(this).append('div')}); });
    return p;
  };
  // Every facet panel registers its option holder here, so redraw() iterates ONE list regardless
  // of which tier a panel lives in (a detail filter stays applied while collapsed).
  const optHolders=[];
  const primaryPanels=renderGroups(bar.append('div'),PRIMARY);
  let detailPanels=null;
  if (nDetail) {
    // The disclosure says WHAT is behind it and how many, so it is not a mystery control.
    const more=bar.append('div').attr('class','xf-more');
    const names=DETAIL.map(g=>g.name.toLowerCase()).join(' + ');
    const btn=more.append('button').attr('type','button');
    const wrap=bar.append('div').attr('class','xf-detail');
    detailPanels=renderGroups(wrap,DETAIL);
    let open=false;
    const sync=()=>{ wrap.classed('show',open);
      btn.html(`${open?'▾':'▸'} ${open?'hide':'show'} ${nDetail} more filters `
        +`<span>${names} knobs</span>`); };
    btn.on('click',()=>{ open=!open; sync(); redraw(); });
    sync();
  }

  const sum=root.append('div').attr('class','xf-sum');
  const sumCount=sum.append('span');
  sum.append('button').attr('class','xf-clear').text('clear all filters')
    .on('click',()=>{ DIMS.forEach(d=>{ sel[d.key].clear(); dims[d.key].filterAll(); });
      HISTS.forEach(h=>{ hrange[h.key]=null; hdims[h.key].filterAll();
        if(brushes[h.key]) brushes[h.key].move(null); });
      redraw(); });

  // --- the brushable histograms ("filter by outcome") -------------------------------------
  // Built once (bins and scales are fixed to the FULL record set, so a bar's position never
  // moves as filters change -- only its highlight does). d3.brushX writes the range; the
  // crossfilter dimension applies it. Guarded on d3.brushX so a stripped vendor bundle keeps
  // the click facets working instead of throwing.
  // buildHists() is DEFERRED to the bottom of the IIFE, after every holder redraw() touches is
  // declared: attaching a brush can fire its handler immediately, and redraw() reads `none` /
  // `tableWrap`, which are const (TDZ) -- building here threw "Cannot access 'none' before
  // initialization" the moment a brush fired during setup.
  const HW=176, HH=58, HM={t:4,r:6,b:12,l:6};
  const brushes={}, hscale={}, hbins={}, hbarSel={}, hLabel={};
  function buildHists(){
    if (typeof d3.brushX !== 'function' || typeof d3.bin !== 'function') return;
    const hcells=histWrap.selectAll('div.xf-h').data(HISTS).join('div').attr('class','xf-h');
    hcells.each(function(h){
      const cell=d3.select(this);
      const vals=nums(h.key);
      const lo=d3.min(vals), hi=d3.max(vals);
      const head=cell.append('h6');
      head.append('span').text(`${h.label}${h.unit?' ('+h.unit+')':''}`);
      hLabel[h.key]=head.append('b').attr('class','off').text('all');
      // A log axis cannot start at or below zero; fall back to linear when any value would be
      // clipped, rather than silently dropping those runs off the chart.
      const useLog = h.log && lo>0;
      const x=(useLog?d3.scaleLog():d3.scaleLinear()).domain([lo,hi]).range([HM.l,HW-HM.r]).nice();
      hscale[h.key]=x;
      const thresholds = useLog
        ? d3.range(12).map(i=>x.invert(HM.l+(HW-HM.l-HM.r)*i/11))
        : x.ticks(11);
      const bins=d3.bin().domain(x.domain()).thresholds(thresholds)(vals);
      hbins[h.key]=bins;
      const ymax=d3.max(bins,b=>b.length)||1;
      const y=d3.scaleLinear().domain([0,ymax]).range([HH-HM.b,HM.t]);
      const svg=cell.append('svg').attr('viewBox',`0 0 ${HW} ${HH}`)
        .attr('preserveAspectRatio','none');
      hbarSel[h.key]=svg.append('g').selectAll('rect').data(bins).join('rect')
        .attr('class','bar')
        .attr('x',b=>x(b.x0)).attr('y',b=>y(b.length))
        .attr('width',b=>Math.max(1,x(b.x1)-x(b.x0)-0.6))
        .attr('height',b=>Math.max(0,(HH-HM.b)-y(b.length)));
      const fmt=v=>(Math.abs(v)>=1000?d3.format(',.0f')(v):d3.format(v<10?'.1f':'.0f')(v));
      svg.append('text').attr('class','axlab').attr('x',HM.l).attr('y',HH-2).text(fmt(lo));
      svg.append('text').attr('class','axlab').attr('x',HW-HM.r).attr('y',HH-2)
        .attr('text-anchor','end').text(fmt(hi));
      const brush=d3.brushX().extent([[HM.l,HM.t],[HW-HM.r,HH-HM.b]])
        .on('brush end',(ev)=>{
          if(!ev.selection){ hrange[h.key]=null; hdims[h.key].filterAll(); }
          else {
            const [a,b]=ev.selection.map(x.invert);
            hrange[h.key]=[a,b];
            // typeof guard: a null metric must not pass a numeric range (and must not throw).
            hdims[h.key].filterFunction(v=>typeof v==='number'&&isFinite(v)&&v>=a&&v<=b);
          }
          redraw();
        });
      brushes[h.key]=svg.append('g').attr('class','brush').call(brush);
    });
  }

  // Only offer a view the run set actually measured — a y-axis of all-nulls is a blank chart.
  const hasVals = k => RECORDS.some(r=>typeof r[k]==='number' && isFinite(r[k]));
  const AXES = VIEWS.filter(v=>hasVals(v.key));
  let view = AXES[0] || VIEWS[0];

  const vbar=root.append('div').attr('class','xf-views');
  vbar.append('span').attr('class','lb').text('y-axis');
  const vbtns=vbar.selectAll('div.xf-view').data(AXES).join('div').attr('class','xf-view')
    .on('click',(ev,v)=>{ view=v; rescaleY(); redraw(); });
  vbtns.append('span').text(d=>d.short);
  vbtns.append('span').attr('class','u').text(d=>d.unit);
  const vnote=root.append('div').attr('class','xf-head').style('margin-top','6px')
    .style('text-transform','none').style('letter-spacing','0').style('font-weight','400');

  const SW=820,SH=300,SM={t:16,r:18,b:44,l:62};
  const svg=root.append('svg').attr('id','xf-scatter')
    .attr('viewBox',`0 0 ${SW} ${SH}`).attr('width','100%');
  const gx=svg.append('g').attr('transform',`translate(0,${SH-SM.b})`);
  const gy=svg.append('g').attr('transform',`translate(${SM.l},0)`);
  const gpt=svg.append('g');
  svg.append('text').attr('x',SM.l+(SW-SM.l-SM.r)/2).attr('y',SH-8)
    .attr('text-anchor','middle').attr('font-size',12).attr('fill','currentColor')
    .text(ax('cl_log'));
  const ylab=svg.append('text').attr('transform',`rotate(-90 14 ${SM.t+(SH-SM.t-SM.b)/2})`)
    .attr('x',14).attr('y',SM.t+(SH-SM.t-SM.b)/2).attr('text-anchor','middle')
    .attr('font-size',12).attr('fill','currentColor');

  const clVals=RECORDS.map(r=>r.cl).filter(v=>v>0);
  const x=d3.scaleLog().range([SM.l,SW-SM.r])
    .domain([(d3.min(clVals)||1)/1.3,(d3.max(clVals)||10)*1.3]);
  let y=d3.scaleLinear().range([SH-SM.b,SM.t]).domain([0,1]);
  const conc=[...new Set(RECORDS.map(r=>r.conc))].sort((a,b)=>a-b);
  const col=d3.scaleOrdinal().domain(conc)
    .range(['#08306b','#1a5296','#2e74b5','#5a9bd4','#8fbce0','#bcd7ec','#dceaf6']);
  gx.call(d3.axisBottom(x).ticks(4,',').tickSize(4)).attr('font-size',11);

  function rescaleY(){
    // Scale to the FULL record set, not the filtered one, so points do not jump as you filter.
    const vals=RECORDS.map(r=>r[view.key]).filter(v=>typeof v==='number'&&isFinite(v)&&v>0);
    const hi=d3.max(vals)||1, lo=d3.min(vals)||hi/10;
    // A log axis needs a positive floor; latency spans orders of magnitude, rates do not.
    y=(view.log&&lo>0?d3.scaleLog():d3.scaleLinear()).range([SH-SM.b,SM.t])
      .domain(view.log&&lo>0?[lo/1.4,hi*1.4]:[0,hi*1.08]);
    gy.call(d3.axisLeft(y).ticks(5,view.log?',':undefined)).attr('font-size',11);
    ylab.text(`${view.label} (${view.unit})`);
    vbtns.classed('on',d=>d.key===view.key);
    vnote.text(view.note);
  }
  rescaleY();

  const none=root.append('div').attr('class','xf-none')
    .html('<b>No runs match this combination.</b> These filters span values the search never '
      +'measured together — the capacity probe visits a different concurrency ladder per topology, '
      +'so many config×load pairs have no run, and a brushed outcome range excludes runs whose '
      +'metric was never measured. Clear a filter to see data again.');
  // --- hover card + click-to-inspect panel ------------------------------------------------
  // The SVG <title> the browser draws is unstyled, slow to appear and untruncatable, so the
  // hover is our own fixed-position card; clicking pins the run's full deployment below.
  const tip=d3.select(document.body).append('div').attr('class','xf-tip');
  const panel=root.append('div').attr('class','xf-panel');
  let picked=null;

  const f1=v=>v==null?'n/a':(+v).toFixed(1);                 // null-safe 1-decimal
  const fk=v=>v==null?'n/a':d3.format(',.0f')(v);            // null-safe integer
  const fms=v=>v==null?'n/a':(v>=1000?d3.format(',.0f')(v)+' ms':(+v).toFixed(1)+' ms');

  function tipHTML(r){
    // Lead with the metric currently on the y-axis — that is the question being asked.
    const rows=[[view.label, view.key==='pu'?f1(r[view.key])+' tok/s':fms(r[view.key])],
                [lab('conc'), fk(r.conc)],
                [lab('cl'), fk(r.cl)+' tok/s'],
                [lab('tpg'), f1(r.tpg)+' tok/s'],
                [lab('gpus'), `${fk(r.gpus)}${r.nodes>1?' · '+r.nodes+' nodes':''}`]];
    if (view.key!=='pu') rows.splice(1,0,[lab('pu'), f1(r.pu)+' tok/s']);
    // Name the knobs that distinguish this run from its same-shape siblings (build_records fills
    // r.knobs with exactly the knobs that vary across the set). Without this, two points on the
    // same topology that differ only in routing look identical on hover.
    const KN={route:'Routing',scorers:'Scorers',mnbt:'Batch tokens',mns:'Max seqs',
              bs:'Block size',gmu:'GPU mem util',schedp:'Scheduler',admit:'Admission',
              a2a:'MoE dispatch'};
    const knobs=Object.entries(r.knobs||{}).filter(([k,v])=>v!=null&&KN[k])
      .map(([k,v])=>`<dt>${KN[k]}</dt><dd>${v}</dd>`).join('');
    return `<h6>${r.series}</h6>`
      + (r.variant?`<p class="var">${r.variant}</p>`:'')
      + `<dl>`
      + rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')
      + `</dl>`
      + (knobs?`<dl style="margin-top:5px;padding-top:5px;border-top:1px solid var(--line)">`
          +`${knobs}</dl>`:'')
      + `${r.ok?'':`<p class="bad">Not servable: ${(r.viol||[]).join('; ')}</p>`}`
      + `<p class="cta">click to see the deployment</p>`;
  }
  function showTip(ev,r){
    tip.html(tipHTML(r)).classed('show',true);
    const b=tip.node().getBoundingClientRect();
    // Keep the card on screen: flip left/up near the right or bottom edge.
    const px=ev.clientX+16, py=ev.clientY+14;
    tip.style('left',(px+b.width>window.innerWidth?ev.clientX-b.width-16:px)+'px')
       .style('top',(py+b.height>window.innerHeight?ev.clientY-b.height-14:py)+'px');
  }
  const hideTip=()=>tip.classed('show',false);

  function showPanel(r){
    picked=r.id;
    const dl=rows=>'<dl>'+rows.filter(x=>x[1]!=null&&x[1]!=='')
      .map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>';
    const parallel=dl([
      ['Tensor parallel', r.tp], ['Data parallel', r.dp],
      ['Pipeline parallel', r.pp], ['Expert parallel', r.epw?`width ${r.epw}`:'off'],
      ['Instances', r.ni], ['GPUs total', fk(r.gpus)],
      ['Nodes', r.nodes], ['Fabric', r.fabric||(r.nodes>1?'ib-400g':'—')],
    ]);
    const engine=dl([
      ['block_size', r.bs], ['max_num_seqs', r.mns],
      ['max_num_batched_tokens', r.mnbt==null?null:d3.format(',')(r.mnbt)],
      ['max_model_len', r.mml==null?null:d3.format(',')(r.mml)],
      ['gpu_memory_utilization', r.gmu], ['cudagraph_mode', r.cg],
      ['quantization', r.quant||'checkpoint'], ['cache_dtype', r.cdt||'checkpoint'],
      ['all2all_backend', r.a2a==='n/a'?null:r.a2a],
    ]);
    // Cluster-level policy: these are CLI flags, not scenario fields, and they are often what
    // separates two runs of the same topology (routing swung throughput 2.3x on kimi-k2.5).
    const policy=dl([
      ['routing_policy', r.route||'round-robin'],
      ['routing_scorers', r.scorers||(r.route==='weighted'?'default profile':null)],
      ['scheduler', r.schedp||'default'],
      ['admission_policy', r.admit||'always-admit'],
      ['prefill/decode', r.pd],
      ['draft tokens (MTP)', r.mtp||'off'],
    ]);
    const measured=dl([
      [lab('conc'), fk(r.conc)], [lab('pu'), f1(r.pu)+' tok/s'],
      [lab('cl'), fk(r.cl)+' tok/s'], [lab('tpg'), f1(r.tpg)+' tok/s'],
      [lab('itl'), fms(r.itl)], [lab('ttft'), fms(r.ttft)],
      [lab('e2e'), fms(r.e2e)], [lab('sched'), fms(r.sched)],
      ['Servable', r.ok?'yes':'no'],
    ]);
    panel.html(
      `<div class="ph"><h5>${r.series} &nbsp;·&nbsp; ${fk(r.conc)} sessions`
      + (r.variant?` &nbsp;<span style="color:var(--accent);font-size:12px;`
          +`font-family:var(--sans)">${r.variant}</span>`:'')+`</h5>`
      + `<button class="x" type="button">close</button></div>`
      + `<div class="xf-grid">`
      + `<section><h6>Parallelism</h6>${parallel}</section>`
      + `<section><h6>Engine</h6>${engine}</section>`
      + `<section><h6>Routing &amp; policy</h6>${policy}</section>`
      + `<section><h6>Measured</h6>${measured}</section></div>`
      + (r.ok?'':`<p class="bad" style="color:var(--bad);font-family:var(--sans);font-size:12px">`
          +`Not servable: ${(r.viol||[]).join('; ')}</p>`)
      + `<div class="xf-cmd"><h6 style="font-family:var(--sans);font-size:10px;`
      + `letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px;`
      + `font-weight:700">Reproduce this run</h6>`
      + (r.cmd?`<pre>${r.cmd.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>`
             :`<p class="none">The command was not recorded for this run`
              +`${r.scen?` (scenario <code>${r.scen}</code>)`:''}.</p>`)
      + `</div>`)
      .classed('show',true);
    panel.select('button.x').on('click',()=>{ picked=null; panel.classed('show',false); redraw(); });
    redraw();
  }

  const tableWrap=root.append('div').attr('id','xf-table');
  // Column heads are lab(key): the same names the dashboard's run log uses, from one file.
  const COLS=[
    ['conc',v=>v],['series',v=>v],
    ['variant',v=>v||'—'],['route',v=>v],
    ['tp',v=>v],['dp',v=>v],['epw',v=>v==null?'off':v],
    ['pd',v=>v],['mtp',v=>v],['mnbt',v=>d3.format(',')(v)],
    ['mns',v=>v],['pu',v=>v.toFixed(1)],
    ['cl',v=>d3.format(',.0f')(v)],
    ['tpg',v=>v.toFixed(1)],['itl',v=>v.toFixed(1)],
    ['ttft',v=>d3.format(',.0f')(v)],
    ['sched',v=>d3.format(',.0f')(v)],
    ['hit',v=>v==null?'–':v.toFixed(2)],
    ['p95',v=>v?d3.format(',.0f')(v/1000):'–'],
    ['to',v=>d3.format(',.0f')(v)],
  ].map(([k,fmt])=>[k, k==='to'?'dropped':lab(k), fmt]);
  const table=tableWrap.append('table');
  const numCols=['conc','tp','dp','epw','mtp','mnbt','mns','pu','cl','tpg','itl','ttft','sched',
                 'hit','p95','to'];
  table.append('thead').append('tr').selectAll('th').data(COLS).join('th')
    .attr('class',d=>numCols.includes(d[0])?'n':null).text(d=>d[1]);
  const tbody=table.append('tbody');

  function apply(key){ const s=sel[key];
    dims[key].filterFunction(v=>s.size===0||s.has(String(v))); }

  function redraw(){
    optHolders.forEach(function({dim:d, sel:holder}){
      // group().all() counts respect every OTHER dimension's filter (not this dim's own), so a
      // zero here means "clicking this option yields no runs under the current selection". We dim
      // and disable those instead of letting a click blank the whole plot. An option already
      // selected stays clickable so it can be toggled back off.
      const vals=groups[d.key].all();
      const sorted=d.order? vals.slice().sort((a,b)=>d.order(+a.key,+b.key))
                          : vals.slice().sort((a,b)=>b.value-a.value);
      holder.selectAll('div.xf-opt').data(sorted,g=>g.key)
        .join(enter=>enter.append('div').attr('class','xf-opt')
          .on('click',(ev,g)=>{ const k=String(g.key);
            // block clicks on an empty, not-yet-selected option (would match zero runs)
            if(g.value===0 && !sel[d.key].has(k)) return;
            sel[d.key].has(k)?sel[d.key].delete(k):sel[d.key].add(k);
            apply(d.key); redraw(); })
          .call(e=>{ e.append('span').attr('class','k'); e.append('span').attr('class','c'); }))
        .classed('on',g=>sel[d.key].has(String(g.key)))
        .classed('empty',g=>g.value===0 && !sel[d.key].has(String(g.key)))
        .call(n=>{ n.select('.k').text(g=>levelLabel(d.key, g.key));
          n.select('.c').text(g=>g.value); });
    });
    // Mark the bars inside each active brush, and show the range numerically (a brush you can
    // see but not read is not a filter you can report).
    HISTS.forEach(h=>{
      const rg=hrange[h.key];
      if(hbarSel[h.key]) hbarSel[h.key].classed('sel',b=>!rg||(b.x1>=rg[0]&&b.x0<=rg[1]));
      if(hLabel[h.key]){
        const f=v=>(Math.abs(v)>=1000?d3.format(',.0f')(v):d3.format(v<10?'.1f':'.0f')(v));
        hLabel[h.key].classed('off',!rg).text(rg?`${f(rg[0])}–${f(rg[1])}`:'all');
      }
    });
    const rows=dims.conc.top(Infinity).slice().sort((a,b)=>(b.pu??-Infinity)-(a.pu??-Infinity));
    const n=rows.length,nok=rows.filter(r=>r.ok).length;
    none.classed('show', n===0);   // selection matched no runs -> explain instead of a blank plot
    // build_records intentionally emits null pu/cl/itl for rejected/MTP/missing-metric runs; EVERY
    // read below must tolerate null or one such row kills the whole explorer (review F4). f1/fk
    // are defined once above, next to the hover card that also uses them.
    const bestPu=d3.max(rows,r=>r.pu), bestCl=d3.max(rows,r=>r.cl);  // d3.max skips null/undefined
    sumCount.html(`<b>${n}</b> of ${RECORDS.length} runs selected &nbsp;&middot;&nbsp; `
      +`<b>${nok}</b> meet every limit &nbsp;&middot;&nbsp; `
      +(n?`best <b>${f1(bestPu)}</b> ${lab('pu')}, `
        +`<b>${fk(bestCl)}</b> ${lab('cl')}`:''));
    // Only points with BOTH axes present can be placed on the scatter; the rest still appear in the
    // table (which shows "–" per null cell) but are not plotted.
    // Only points with BOTH axes present can be placed; a run missing the CURRENT y-metric stays
    // in the table (which shows "–") rather than being drawn at a made-up height.
    const plot=rows.filter(r=>r.cl!=null && typeof r[view.key]==='number' && isFinite(r[view.key]));
    gpt.selectAll('g.p').data(plot,r=>r.id)
      .join(enter=>enter.append('g').attr('class','p'))
      .classed('sel',r=>r.id===picked)
      .on('mousemove',showTip).on('mouseleave',hideTip)
      .on('click',(ev,r)=>{ ev.stopPropagation(); hideTip(); showPanel(r); })
      .call(g=>{
        g.selectAll('circle').data(r=>[r]).join('circle')
          .attr('cx',r=>x(r.cl)).attr('cy',r=>y(r[view.key])).attr('r',5)
          .attr('fill',r=>r.ok?col(r.conc):'none')
          .attr('stroke',r=>r.ok?'none':'#b2182b').attr('stroke-width',1.7)
          .attr('stroke-dasharray',r=>r.ok?null:'2.5 2')
          .attr('opacity',r=>r.ok?0.9:0.85); });
    tbody.selectAll('tr').data(rows.slice(0,250),r=>r.id).join('tr')
      .attr('class',r=>r.ok?null:'bad')
      .style('cursor','pointer')
      .on('mousemove',showTip).on('mouseleave',hideTip)
      .on('click',(ev,r)=>{ hideTip(); showPanel(r); })
      .each(function(r){ d3.select(this).selectAll('td')
        .data(COLS.map(c=>[c,r[c[0]]]),d=>d[0][0]).join('td')
        .attr('class',d=>numCols.includes(d[0][0])?'n':null)
        .text(d=>d[1]===null||d[1]===undefined?'–'
          :(typeof d[1]==='boolean'?(d[1]?'yes':'no'):d[0][2](d[1]))); });
  }
  buildHists();   // safe now: every holder redraw() reads is initialized (see buildHists' note)
  redraw();
})();
</script>
</body></html>
