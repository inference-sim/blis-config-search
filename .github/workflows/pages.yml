name: pages

# Build the config-search webpage (Vite + React SPA) and deploy it to GitHub Pages via the
# Actions artifact path (Pages source = "GitHub Actions"; no gh-pages branch, no built assets
# in git). The build stages the committed reports/ into the SPA, so the live site is plain
# static files served by GitHub — NO Python/Node server runs at view time.
#
# On a pull request: build + validate only; nothing is published, job is read-only.
# On push to main (i.e. after a maintainer merges): build + publish.
#
# ONE-TIME repo setting: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "reports/**"
      - "gallery/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build + stage data, then build the SPA
        working-directory: web
        env:
          NO_MOCK: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}  # production (main) hides mock scenarios
        run: |
          npm ci
          npm run build   # prebuild runs stage:data (build_gallery.py -> site/ -> public/data/)
      - name: Sanity-check the built site
        working-directory: web
        run: |
          test -f dist/index.html || { echo "FATAL: dist/index.html missing" >&2; exit 1; }
          test -f dist/data/scenarios.json || { echo "FATAL: dist/data/scenarios.json missing" >&2; exit 1; }
          test -f dist/data/catalog.json || { echo "FATAL: dist/data/catalog.json missing" >&2; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          scen = json.load(open("dist/data/scenarios.json"))
          missing = [s["run_id"] for s in scen if not os.path.isfile(f"dist/data/reports/{s['run_id']}/index.html")]
          if missing:
              sys.exit("missing reports: " + ", ".join(missing))
          print(f"ok: {len(scen)} scenarios, every report present")
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
