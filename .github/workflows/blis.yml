name: blis

# The shared BLIS pull-request checks (design §13.2), called from blis-substrate by commit (X21):
# workflow lint, version literals, documentation references, the generated AGENTS.md section and
# pull-request template, the selected-version lint. There is no scheduled run: CI checks product
# correctness only, and an edit of the pull request's title or body starts no run (M3.2 row 22).
# The pinned commit still has the description, commit-policy and cited-issue steps; the pin moves
# to the substrate release whose shared-pr-checks.yml has dropped them.
#
# The commit is blis-substrate release v0.14.1 (f9f3c93), the release pins.env's SUBSTRATE_REF
# names; it moves with that pin. v0.14.1's description check accepts a dependency pin written as
# a release tag ("owner/repo at vX.Y.Z <hash>"), the form the pin-bump PR body uses.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr:
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@f9f3c9327794d543a0915c4deb1259ff9985c753
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      repo: blis-config-search
      substrate-ref: f9f3c9327794d543a0915c4deb1259ff9985c753
