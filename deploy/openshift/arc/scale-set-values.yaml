# gha-runner-scale-set for this repo: the runners pin-compat's smoke and regen-reports' sweeps
# use via `vars.REGEN_RUNS_ON` (see README.md).
githubConfigUrl: https://github.com/inference-sim/blis-config-search
githubConfigSecret: blis-config-search-runner-token   # key: github_token
runnerScaleSetName: blis-bigmem                       # what `runs-on` names
minRunners: 0
maxRunners: 16                                        # REGEN_MAX_PARALLEL's default; jchen has no quota

controllerServiceAccount:
  namespace: jchen
  name: arc-gha-rs-controller

template:
  spec:
    # The chart's own runner SA may not use anyuid; jchen's `default` SA already may.
    serviceAccountName: default
    automountServiceAccountToken: false   # jobs never need the k8s API; keep the SA token out
    securityContext:
      runAsUser: 1001          # the image's `runner` user; needs the anyuid SCC
      runAsGroup: 1001
      fsGroup: 1001
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
        # Go sizes its scheduler from the node's 224 cores, not the cgroup; one run uses ~1.1 cores.
        env:
          - {name: GOMAXPROCS, value: "2"}
        resources:
          # Sized for SWEEP_MAX_PARALLEL=8: a 64-GPU replay run peaks >20 GiB, and a too-small
          # limit stalls in direct reclaim rather than OOM-killing.
          requests: {cpu: "10", memory: 224Gi}
          limits: {cpu: "16", memory: 288Gi}
