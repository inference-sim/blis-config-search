name: pinned-blis
description: The simulator binary at pins.env's BLIS_SHA (the M3.2 stack head, then its release tag), at upstream/blis. Built once per commit and cached.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        set -euo pipefail
        set -a; . ./pins.env; set +a
        echo "sha=$BLIS_SHA" >> "$GITHUB_OUTPUT"
        if echo "$BLIS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          # The M3.2 stack head is pinned by its commit, which names fixed content: it is BLIS_SHA itself.
          [ "$BLIS_REF" = "$BLIS_SHA" ] || { echo "::error::BLIS_REF is a commit, so BLIS_SHA must be the same commit" >&2; exit 1; }
        else
          # A tag or branch can move; refuse it even when the binary is cached.
          url=https://github.com/inference-sim/inference-sim.git
          now="$(git ls-remote "$url" "refs/heads/$BLIS_REF" "refs/tags/$BLIS_REF^{}" "refs/tags/$BLIS_REF" | awk '{print $1}' | head -2 | tail -1)"
          [ "$now" = "$BLIS_SHA" ] || { echo "::error::$BLIS_REF no longer resolves to $BLIS_SHA" >&2; exit 1; }
        fi
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: upstream/blis
        key: blis-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.sha }}-${{ hashFiles('.github/actions/pinned-blis/action.yml', 'scripts/build_blis.sh') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        set -a; . ./pins.env; set +a
        rm -rf upstream
        # A commit or a release tag, fetched by name (a tag peels to its commit on checkout).
        git init -q upstream
        git -C upstream remote add origin https://github.com/inference-sim/inference-sim.git
        git -C upstream fetch -q --depth 1 origin "$BLIS_REF"
        git -C upstream checkout -q FETCH_HEAD
        test "$(git -C upstream rev-parse HEAD)" = "$BLIS_SHA" || {
          echo "$BLIS_REF no longer resolves to $BLIS_SHA -- aborting" >&2; exit 1; }
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with: { go-version-file: upstream/go.mod, cache-dependency-path: upstream/go.sum }
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: sh scripts/build_blis.sh upstream
    - shell: bash
      run: chmod +x upstream/blis && upstream/blis --help >/dev/null
