# Many instances means the router decides where every request goes. Which llm-d scheduling
# profile serves agentic traffic best, and how sensitive is the winner to its own weights?
name: deepseek-v4-1-flash-h200-agentx-routing

scenario:
  model: deepseek-v4.1-flash
  hardware: h200
  workload: agentx-mvp
  gpus: 64
  slo: {itl_p99: 20ms}
  concurrency: [8, 16, 32, 64, 128, 256]   # session lanes

sweeps:
  # Whole policies: each value is an EndpointPickerConfig file.
  - name: policies
    num-instances: [2, 8]                  # 2 x TP8xDP4 or 8 x TP4xDP2 = 64
    parallel: {tp: [4, 8], dp: [2, 4], enable_expert_parallel: [true]}
    engine: {cache_dtype: [fp8_ds_mla], max_model_len: [262144]}
    router:
      endpoint_picker_config:
        - routing/random.yaml              # neutral baseline
        - routing/queue.yaml
        - routing/load-aware.yaml
        - routing/queue-kv.yaml
        - routing/prefix-affinity.yaml

  # Knobs INSIDE one policy: start from a file, then sweep its fields by the names the file uses.
  # schedulingProfiles and plugins are keyed by their `name` (a plugin's name defaults to its type).
  - name: queue-kv-weights
    num-instances: [8]
    parallel: {tp: [4], dp: [2], enable_expert_parallel: [true]}
    engine: {cache_dtype: [fp8_ds_mla], max_model_len: [262144]}
    router:
      endpoint_picker_config: [routing/queue-kv.yaml]
      schedulingProfiles:
        default:
          queue-scorer: {weight: [1, 2, 4]}
          kv-cache-utilization-scorer: {weight: [0, 1, 2, 4]}

  - name: prefix-affinity-cache
    num-instances: [8]
    parallel: {tp: [4], dp: [2], enable_expert_parallel: [true]}
    engine: {cache_dtype: [fp8_ds_mla], max_model_len: [262144]}
    router:
      endpoint_picker_config: [routing/prefix-affinity.yaml]
      plugins:
        approx-prefix-cache-producer:
          parameters:
            lruCapacityPerServer: [15625, 31250, 62500]   # default 31250
        prefix-cache-scorer:
          parameters:
            matchLengthWeight: [0.0, 0.5, 1.0]
