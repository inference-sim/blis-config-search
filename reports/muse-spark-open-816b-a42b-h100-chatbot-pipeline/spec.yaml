name: muse-spark-open-816b-a42b-h100-chatbot-pipeline
scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: h100
  workload: chatbot
  gpus: 16
  slo:
    itl_p99: 100ms
  concurrency:
  - 8
  - 32
  - 128
  - 256
sweeps:
- name: no-pipeline
  narrative: The no-pipeline control at 16-way tensor parallelism; a pipelined arm
    has to beat this at the same footprint and load to be worth its boundaries.
  num-instances:
  - 1
  parallel:
    tp:
    - 16
    pp:
    - 1
    dp:
    - 1
    enable_expert_parallel:
    - true
  engine:
    max_model_len:
    - 262144
    max_num_seqs:
    - 64
    - 256
    max_num_batched_tokens:
    - 8192
    gpu_memory_utilization:
    - 0.9
    enable_prefix_caching:
    - true
    async_scheduling:
    - true
- name: pipelined
  narrative: Trading tensor width for pipeline stages should help once the batch is
    full enough to keep every stage busy, and cost more at light load.
  num-instances:
  - 1
  parallel:
    tp:
    - 8
    - 4
    pp:
    - 2
    - 4
    dp:
    - 1
    enable_expert_parallel:
    - true
  engine:
    max_model_len:
    - 262144
    max_num_seqs:
    - 64
    - 256
    max_num_batched_tokens:
    - 8192
    gpu_memory_utilization:
    - 0.9
    enable_prefix_caching:
    - true
    async_scheduling:
    - true
