name: checks

# The hermetic test gate: runs on every PR and every push to main. No BLIS, no network
# beyond npm install, no port binding. If this is red, pages.yml should not publish — so keep
# this fast and deterministic. Two parallel jobs (Python and web) since they share no toolchain.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The second package is a TEST-only dependency, and only this job's: it is what checks that
      # the published experiments/schema.json still agrees with the validator that actually runs.
      # Those tests skip when it is absent, so it goes here rather than in the five other
      # workflows that only need pyyaml -- notably NOT in the fork-safe `experiments` job below.
      - run: pip install pyyaml jsonschema
      # test_build.py checks pins.env's generated block against inference-sim's go.mod, and SKIPS
      # when there is no sibling checkout to derive from -- so without this clone the drift guard
      # silently passes in CI and only ever fires on a developer's machine, which is backwards.
      # Shallow and tags-only: the test reads `git show <BLIS_REF>:go.mod` and nothing else.
      - name: Clone the pinned inference-sim (for the derived-pins drift check)
        run: |
          set -euo pipefail
          . ./pins.env
          git clone --filter=blob:none --no-checkout \
            https://github.com/inference-sim/inference-sim.git ../inference-sim
          git -C ../inference-sim fetch --depth 1 origin "refs/tags/$BLIS_REF:refs/tags/$BLIS_REF"
          # The tag is not immutable upstream; the pin is only meaningful if it still resolves to
          # the recorded commit, so refuse a moved tag here as the other workflows do on clone.
          test "$(git -C ../inference-sim rev-parse "$BLIS_REF^{commit}")" = "$BLIS_SHA" || {
            echo "::error::$BLIS_REF no longer points at $BLIS_SHA" >&2; exit 1; }
      - name: Build + catalog + backend tests
        run: |
          python3 -I scripts/test_build.py
          python3 -I scripts/test_backend.py
      - name: Skill report/runner tests (data producer contract)
        run: |
          python3 -I .claude/skills/config-search/scripts/test_report.py
          python3 -I .claude/skills/config-search/scripts/test_run_blis.py
      - name: Experiment spec pipeline tests (validator, grids, overrides, ranking)
        run: python3 -I scripts/test_experiment.py

  # Validate every committed Experiment Spec. Separate from the test job because this is the
  # check a CONTRIBUTOR's PR is judged on: it reads only YAML from the repo, needs no secrets and
  # runs no BLIS, so it is safe on a fork PR and gives a spec author a fast, specific answer.
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Validate experiments/
        run: python3 -I scripts/validate_experiment.py experiments/
      - name: Knob profile smoke test (no catalog checkout -> must degrade, not crash)
        run: |
          python3 -I -c "import sys; sys.path.insert(0,'scripts'); import knob_profile; print('ok')"
      - name: Expand every spec's grids (catches a spec that would run nothing)
        run: |
          set -euo pipefail
          for spec in experiments/*.yaml; do
            python3 -I scripts/run_experiment.py "$spec" --dry-run
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install, typecheck, test, build
        working-directory: web
        run: |
          npm ci
          npm run stage:data          # exercises the Python data producer + staging seam
          npm run typecheck
          npm run test
          npm run build
