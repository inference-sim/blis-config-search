name: pages

# Build the config-search webpage (Vite + React SPA) and publish it to GitHub Pages from the
# `gh-pages` branch. The build stages the committed reports/ into the SPA, so the live site is
# plain static files served by GitHub — NO Python/Node server runs at view time.
#
#   push to main  -> build + publish to the ROOT of gh-pages (the live site)
#   pull request  -> build + publish a PREVIEW to gh-pages/pr-preview/pr-<N>/, and post a sticky
#                    comment with its link; the preview is removed when the PR closes
#
# Why a branch rather than the Actions artifact path: Pages-from-Actions holds exactly ONE
# deployment, so a PR build would replace the live site. A branch can hold the live site and
# every open PR's preview side by side.
#
# The live root and the previews never clobber each other: the main deploy keeps
# pr-preview/ (clean-exclude), and each PR writes only its own subfolder.
#
# A FORK PR gets a build-only check and no preview: its GITHUB_TOKEN is read-only, and
# publishing a stranger's build on this repo's domain is not something to do unreviewed.
#
# ONE-TIME repo setting: Settings -> Pages -> Build and deployment -> Source = "Deploy from a
# branch", branch `gh-pages`, folder `/ (root)`. (The first main push creates the branch.)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "reports/**"
      - "gallery/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (and one for main), NOT one shared group: GitHub keeps at most one pending
  # run per group and cancels the older pending run when a newer one arrives, so a single
  # shared group silently cancelled previews whenever 3+ PRs pushed at once (e.g. a regen batch).
  # Runs for the same PR still queue in order. Runs for different PRs may push gh-pages
  # concurrently; each touches only its own pr-preview/pr-<N>/ folder, so a rejected
  # (non-fast-forward) push is the worst case. Re-run the job if that ever happens.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A closed PR has nothing to build -- the preview job below just removes its folder.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build + stage data, then build the SPA
        working-directory: web
        env:
          NO_MOCK: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}  # production (main) hides mock scenarios
        run: |
          npm ci
          npm run build   # prebuild runs stage:data (build_gallery.py -> site/ -> public/data/)
      - name: Sanity-check the built site
        working-directory: web
        run: |
          test -f dist/index.html || { echo "FATAL: dist/index.html missing" >&2; exit 1; }
          test -f dist/data/scenarios.json || { echo "FATAL: dist/data/scenarios.json missing" >&2; exit 1; }
          test -f dist/data/catalog.json || { echo "FATAL: dist/data/catalog.json missing" >&2; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          scen = json.load(open("dist/data/scenarios.json"))
          missing = [s["run_id"] for s in scen if not os.path.isfile(f"dist/data/reports/{s['run_id']}/index.html")]
          if missing:
              sys.exit("missing reports: " + ", ".join(missing))
          print(f"ok: {len(scen)} scenarios, every report present")
          PY
      - name: Upload the built site for the deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the built site to gh-pages
    steps:
      # The deploy action pushes from a git working tree; without a checkout it fails with
      # "fatal: not in a git directory".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: site, path: dist }
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          # Keep the open PRs' previews when the live root is replaced.
          clean-exclude: pr-preview/
          commit-message: "Deploy main @ ${{ github.sha }}"

  preview:
    # Same-repo PRs only: a fork's token cannot write gh-pages (see the header).
    # always(): on `closed` the build job is skipped, and a skipped `needs` would skip this too.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the preview folder to gh-pages
      pull-requests: write     # post / update the sticky preview comment
      pages: read              # poll the Pages build so the comment waits for a live preview
    steps:
      # The preview action reads the checkout for git config, and on `closed` it only removes.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with: { name: site, path: dist }
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976  # v1.8.2
        id: pr-preview
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto           # deploy on open/sync, remove on close
          qr-code: "false"
          # The action's own wait fails when the Pages build of the preview commit is superseded:
          # GitHub drops a build as `errored` (0s) when a newer gh-pages push lands mid-build, which
          # happens whenever main or another PR deploys at the same time. So the wait and the
          # deploy comment are done by the steps below; the action still posts the removal comment.
          wait-for-pages-deployment: false
          comment: ${{ github.event.action == 'closed' }}
      - name: Wait until Pages serves the preview commit (or a later one)
        id: wait-pages
        if: github.event.action != 'closed' && steps.pr-preview.outputs.deployed-commit-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pr-preview.outputs.deployed-commit-sha }}
        run: |
          # Any later gh-pages commit still contains this preview folder (previews only ever add
          # or remove their own pr-<N>/ and the main deploy keeps pr-preview/), so a `built`
          # build of SHA or of any descendant means the preview is live.
          contains() {  # does gh-pages commit $1 contain $SHA?
            [ "$1" = "$SHA" ] && return 0
            st=$(gh api "repos/$REPO/compare/$SHA...$1" --jq .status 2>/dev/null) || return 1
            [ "$st" = ahead ] || [ "$st" = identical ]
          }
          deadline=$((SECONDS + 1800)); tip_errored_polls=0
          while [ $SECONDS -lt $deadline ]; do
            builds=$(gh api "repos/$REPO/pages/builds?per_page=30" --jq '.[] | "\(.commit) \(.status)"')
            while read -r commit status; do
              if [ "$status" = built ] && contains "$commit"; then
                echo "Pages build of $commit is built (contains $SHA)"; exit 0
              fi
            done <<< "$builds"
            # Fail fast only on a real error: the build of the CURRENT gh-pages tip errored and
            # no newer push has superseded it for a couple of polls.
            tip=$(gh api repos/$REPO/branches/gh-pages --jq .commit.sha)
            if grep -q "^$tip errored$" <<< "$builds"; then
              tip_errored_polls=$((tip_errored_polls + 1))
              if [ $tip_errored_polls -ge 3 ]; then
                echo "::error::Pages build of gh-pages tip $tip errored"; exit 1
              fi
            else
              tip_errored_polls=0
            fi
            echo "Waiting for a built Pages build containing $SHA (tip $tip)..."
            sleep 10
          done
          echo "::error::Timed out waiting for the Pages build of $SHA"; exit 1
      - name: Post the sticky preview comment
        if: steps.wait-pages.outcome == 'success'
        # Same action + header that pr-preview-action uses, so it updates the existing comment.
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db  # v2.9.2
        with:
          header: pr-preview
          message: |
            [PR Preview Action](https://github.com/rossjrw/pr-preview-action) ${{ steps.pr-preview.outputs.action-version }}
            :---:
            :rocket: View preview at ${{ steps.pr-preview.outputs.preview-url }}
            <h6>Built to branch [`gh-pages`](${{ github.server_url }}/${{ github.repository }}/tree/gh-pages) at ${{ steps.pr-preview.outputs.action-start-time }}; the Pages deployment is live.</h6>
