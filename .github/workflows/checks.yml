name: checks

# The hermetic test gate: runs on every PR and every push to main. No BLIS, no network
# beyond npm install, no port binding. If this is red, pages.yml should not publish — so keep
# this fast and deterministic. Two parallel jobs (Python and web) since they share no toolchain.

on:
  pull_request:
    # `edited` is how a retarget to main (a base change) reaches CI; the default types omit it.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # The bot's PRs (bump-blis-pin, regen-reports) dispatch this, since their PR event starts nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      # The second package is a TEST-only dependency, and only this job's: it is what checks that
      # the published experiments/schema.json still agrees with the validator that actually runs.
      # Those tests skip when it is absent, so it goes here rather than in the five other
      # workflows that only need pyyaml -- notably NOT in the fork-safe `experiments` job below.
      - run: pip install --require-hashes -r requirements.txt
      # test_build.py checks pins.env's generated block against inference-sim's go.mod, and SKIPS
      # when there is no sibling checkout to derive from -- so without this clone the drift guard
      # silently passes in CI and only ever fires on a developer's machine, which is backwards.
      # Shallow: the test reads `git show <BLIS_SHA>:go.mod` and nothing else.
      - name: Clone the pinned inference-sim (for the derived-pins drift check)
        run: |
          set -euo pipefail
          . ./pins.env
          git clone --filter=blob:none --no-checkout \
            https://github.com/inference-sim/inference-sim.git ../inference-sim
          git -C ../inference-sim fetch --depth 1 origin "$BLIS_REF"
          # A tag or branch can move; the pin is only meaningful if it still resolves to the
          # recorded commit, so refuse a moved ref here as the other workflows do on clone.
          # An annotated tag fetches as the tag object; the pin is the commit it points at.
          test "$(git -C ../inference-sim rev-parse 'FETCH_HEAD^{commit}')" = "$BLIS_SHA" || {
            echo "::error::$BLIS_REF no longer points at $BLIS_SHA" >&2; exit 1; }
          git -C ../inference-sim fetch --depth 1 origin "$BLIS_SHA"
      - name: Clone the pinned router configs (the files a spec's router arms use)
        run: |
          set -euo pipefail
          . ./pins.env
          sh scripts/clone_pinned.sh "$ROUTER_CONFIGS_SHA" https://github.com/inference-sim/llm-d-router.git ../llm-d-router
      - name: Build + catalog + pin tests
        run: |
          python3 -I scripts/test_build.py
          python3 -I scripts/test_blis_pin.py
      - name: BLIS runner tests
        run: |
          python3 -I scripts/test_run_blis.py
      - name: Experiment spec pipeline tests (validator, grids, overrides, ranking)
        run: python3 -I scripts/test_experiment.py

  # Validate every committed Experiment Spec. Separate from the test job because this is the
  # check a CONTRIBUTOR's PR is judged on: it needs no secrets and runs only the simulator's
  # read-only commands, which supply the setting names and catalog identities (CFG-3), so it is
  # safe on a fork PR and gives a spec author a fast, specific answer.
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - name: Clone the pinned simulator
        run: |
          set -euo pipefail
          set -a; . ./pins.env; set +a
          git clone --branch "$BLIS_REF" --depth 1 https://github.com/inference-sim/inference-sim.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "$BLIS_SHA" || {
            echo "$BLIS_REF no longer resolves to $BLIS_SHA -- aborting" >&2; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: upstream/go.mod, cache-dependency-path: upstream/go.sum }
      - run: cd upstream && go build -o blis main.go
      - name: Clone the pinned router configs (the files a spec's router arms use)
        run: |
          set -euo pipefail
          . ./pins.env
          sh scripts/clone_pinned.sh "$ROUTER_CONFIGS_SHA" https://github.com/inference-sim/llm-d-router.git ../llm-d-router
      - name: Fetch the pinned engine field list
        run: python3 -I scripts/fetch_fields.py "$RUNNER_TEMP/fields.json"
      - name: Validate experiments/
        env: { BLIS: upstream/blis }
        run: python3 -I scripts/validate_experiment.py experiments/ --fields "$RUNNER_TEMP/fields.json"
      - name: Knob profile smoke test (no catalog checkout -> must degrade, not crash)
        run: |
          python3 -I -c "import sys; sys.path.insert(0,'scripts'); import knob_profile; print('ok')"
      - name: Expand every spec's grids (catches a spec that would run nothing)
        run: |
          set -euo pipefail
          for spec in experiments/*.yaml; do
            python3 -I scripts/run_experiment.py "$spec" --dry-run --blis upstream/blis --fields "$RUNNER_TEMP/fields.json"
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "22" }
      - name: Install, typecheck, test, build
        working-directory: web
        run: |
          npm ci
          npm run stage:data          # exercises the Python data producer + staging seam
          npm run typecheck
          npm run test
          npm run build
