# Does drafting pay on an agentic replay? -- RFC #21's headline example, verbatim.
#
# Two sweeps over one scenario: the same topology grid with drafting off, then on at three
# depths. Because the grid is identical, every drafting row has an exact no-drafting twin at
# the same topology and load, which is what makes the comparison readable.
name: deepseek-v4-1-flash-h100-agentx-drafting

scenario:                       # shared by every sweep
  model: deepseek-v4.1-flash
  hardware: h100
  workload: agentx-mvp
  gpus: 32                      # EVERY run uses exactly 32 GPUs
  slo: {itl_p99: 20ms}
  concurrency: [4, 8, 16, 32, 64, 128]

sweeps:
  - name: no-drafting
    narrative: >
      The baseline. If drafting does not beat this at the same topology and load, the
      drafter is not paying for itself on this traffic.
    num-instances: [1, 2, 4]
    parallel: {tp: [4, 8], dp: [1, 2, 4, 8], enable_expert_parallel: [true]}

  - name: drafting
    # Measured on b200: K=1 lost 25% while K=5 gained 13%, so the direction is not monotonic at
    # small K -- which is why depth is swept rather than assumed.
    narrative: >
      Drafting should pay on this decode-bound replay, and the gain should grow with draft depth.
    num-instances: [1, 2, 4]
    parallel: {tp: [4, 8], dp: [1, 2, 4, 8], enable_expert_parallel: [true]}
    engine:
      speculative: {method: [dspark], num_spec_tokens: [1, 3, 5]}
