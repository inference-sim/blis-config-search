# Is P/D disaggregation worth it for Muse-Spark (nvfp4) on 8 H100 nodes (64 GPUs) under AgentX?
# The full-PD sibling of #78 (which carries only pd-ratio/pd-always inline); its colocated grid is the control.
# MoE 256 experts top_k 8, SWA, no speculator; 8 nodes are NOT one NVLink domain, so every KV handoff crosses
# the fabric -- here roce-200g (25 GB/s), half an ib-400g link and twice the GB200 rack's free NVLink, which is
# the sharpest test of the fabric lever in the whole campaign.
# H100-specific: 80 GiB ranks need gmu 0.95 for one 262k sequence (single-node 8gpu spec), and KV room is tight
# enough that fp8 KV is its own colocated sweep here -- the H200 PD spec dropped it as identical on 140 GiB ranks.
# Pools stay tp8 dp1 (kv_transfer refuses dp, blis-vllm#44; one node each), so P + D == 8.
# Left out: eplb, moe_backend, quantization, drafting (profile: does not apply).

name: muse-spark-open-816b-a42b-h100-agentx-8node-pd

scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: h100
  workload: agentx-mvp
  gpus: 64
  cluster: {fabric: roce-200g}            # H100 fleets run on RoCE; every cross-node handoff prices at 25 GB/s, not IB's 50
  engine:
    max_model_len: 262144                 # at the 32k default the replay drops every trace
    gpu_memory_utilization: 0.95          # H100 TP8 refuses at 0.9 for one 262k sequence (single-node spec)
  concurrency: [64, 128, 256, 512]        # session lanes; 8 GPUs saturated by 64, so 512 is past saturation
  replay:
    corpus: .corpus/traces.jsonl
    corpus_cache: /tmp/agx-cache-muse-h100-8node-pd
    grace_period: inf

sweeps:
  - name: colocated
    # The fair control for every P/D sweep: the colocated shapes P/D has to beat.
    narrative: Eight single-node TP8 instances should lead, since wider dp groups pay cross-node RoCE all-to-all for little extra batch.
    num-instances: [8, 4, 2, 1]
    parallel: {tp: [8, 4], dp: [1, 2, 4, 8], enable_expert_parallel: [true]}

  - name: colocated-tuned
    narrative: A bigger token budget with a long-prefill cap should hold ITL to higher load, narrowing what P/D can win.
    num-instances: [8, 2]
    parallel: {tp: [8], dp: [1, 4], enable_expert_parallel: [true]}
    engine:
      max_num_batched_tokens: [8192, 32768]
      long_prefill_token_threshold: [0, 2048]

  - name: kv-capacity
    # H100-specific (the H200 PD spec dropped it as identical on 140 GiB ranks): 80 GiB ranks leave little KV room
    # at 262k, so fp8 KV may be what lets the wide cross-node shape start at all. Colocated so the two pools' agree-
    # on-cache_dtype rule never applies; cross tp/dp so the pressure differs by per-GPU KV bytes.
    narrative: fp8 KV should matter most where KV room is tightest -- the wide cross-node DP8 shape on 80 GiB ranks -- and substitute for memory the narrow shape already has.
    num-instances: [8, 1]
    parallel: {tp: [8], dp: [1, 8], enable_expert_parallel: [true]}
    engine:
      cache_dtype: [auto, fp8]

  # P/D: pools never share a node, so each handoff crosses RoCE (the fabric lever, twice the cost of the H200 IB
  # twin and not free like the GB200 rack). Pools stay tp8 dp1, so P + D == 8.
  - name: pd-ratio
    narrative: Decode-heavy ratios should win on AgentX, since cached prefixes leave only a short uncached tail to prefill -- and the RoCE handoff taxes the prefill-heavy splits more.
    prefill-instances: [1, 2, 3, 4]
    decode-instances: [7, 6, 5, 4]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    router: &threshold
      endpoint_picker_config: [pd-prefix.yaml]
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 1024, 4096, 16384]}}

  - name: pd-always
    # Same tp8 layouts as pd-ratio; overrides take one base file, so the always-split decider is its own sweep.
    narrative: Splitting every request should trail the threshold arms, because a turn with a cached prefix pays a cross-node RoCE handoff for little prefill.
    prefill-instances: [1, 2, 3, 4]
    decode-instances: [7, 6, 5, 4]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    router: {endpoint_picker_config: [pd-always.yaml]}

  - name: pd-wide-decode
    # A TP16 decode instance is two nodes; P*8 + D*16 == 64 keeps the surviving pairs 2P3D / 4P2D / 6P1D.
    narrative: TP16 decode instances should hold ITL at higher load than TP8 ones, trading batch slots for faster steps.
    prefill-instances: [2, 4, 6]
    decode-instances: [3, 2, 1]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [16], enable_expert_parallel: [true]}}
    router:
      <<: *threshold
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 4096]}}

  - name: pd-pool-engine
    # Decode pools prefill locally whenever the decider skips the split, so their long-prefill cap is live.
    # Per-pool token budgets, neither a must-match knob, so the pools may differ.
    narrative: A 32k prefill budget should matter on the prefill-light layout and a decode-pool prefill cap on the decode-heavy one.
    prefill-instances: [2, 4]
    decode-instances: [6, 4]
    prefill:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {max_num_batched_tokens: [8192, 32768]}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {long_prefill_token_threshold: [0, 2048]}
    router: {endpoint_picker_config: [pd-prefix.yaml]}

  - name: pd-decode-cudagraph
    # Per-step host cost does not interact with topology, so one layout.
    narrative: Full graph capture on the decode pool should lower ITL by a few percent, with FULL_DECODE_ONLY matching FULL there.
    prefill-instances: [3]
    decode-instances: [5]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode:
      parallel: {tp: [8], enable_expert_parallel: [true]}
      engine: {cudagraph_mode: [FULL, FULL_DECODE_ONLY]}
    router: {endpoint_picker_config: [pd-prefix.yaml]}
