name: kimi-k2-5-h200-multidoc
scenario:
  model: kimi-k2.5
  hardware: h200
  cluster:
    gpus_per_node: 8
  workload: multidoc
  gpus: 512
  slo:
    itl_p99: 20ms
  concurrency:
  - 64
  - 256
  - 1024
  - 2048
sweeps:
- name: topology-ep
  narrative: Expert parallelism should win at every width, and wider tp should beat
    wider dp on 10k-token prompts.
  num-instances:
  - 64
  - 32
  - 16
  - 8
  parallel:
    tp:
    - 4
    - 8
    - 16
    dp:
    - 1
    - 2
    - 4
    - 8
    enable_expert_parallel:
    - true
    - false
  engine:
    max_num_batched_tokens:
    - 32768
- name: batch-prefill
  narrative: The per-step token cap should set ITL, and chunking long prefills should
    trade throughput for ITL below it.
  num-instances:
  - 64
  - 8
  parallel:
    tp:
    - 8
    dp:
    - 1
    - 8
    enable_expert_parallel:
    - true
  engine:
    max_num_batched_tokens:
    - 4096
    - 8192
    - 16384
    - 32768
    long_prefill_token_threshold:
    - 0
    - 1024
- name: kv-capacity
  narrative: fp8 KV should pay most where many resident 10k-token sequences make KV
    the binding resource.
  num-instances:
  - 64
  - 8
  parallel:
    tp:
    - 8
    dp:
    - 1
    - 8
    enable_expert_parallel:
    - true
  engine:
    cache_dtype:
    - auto
    - fp8
    max_num_seqs:
    - 256
    - 1024
    max_num_batched_tokens:
    - 8192
    - 32768
- name: moe-collective
  narrative: The all2all gap should widen with EP width and per-step tokens, since
    10k prompts push heavy dispatch volume.
  num-instances:
  - 64
  - 16
  - 8
  parallel:
    tp:
    - 8
    dp:
    - 1
    - 4
    - 8
    enable_expert_parallel:
    - true
  engine:
    all2all_backend:
    - allgather_reducescatter
    - deepep_high_throughput
    - deepep_v2
    - pplx
    max_num_batched_tokens:
    - 8192
    - 32768
- name: cudagraph
  narrative: PIECEWISE should trail the default capture mode and NONE should lose
    heavily, by a similar margin at both fleet ends.
  num-instances:
  - 64
  - 8
  parallel:
    tp:
    - 8
    dp:
    - 1
    - 8
    enable_expert_parallel:
    - true
  engine:
    cudagraph_mode:
    - NONE
    - PIECEWISE
    max_num_batched_tokens:
    - 32768
- name: routing
  narrative: Load- and KV-aware routing should beat random by more on 64 instances
    than on 8, as long prompts land unevenly.
  num-instances:
  - 64
  - 8
  parallel:
    tp:
    - 8
    dp:
    - 1
    - 8
    enable_expert_parallel:
    - true
  engine:
    max_num_batched_tokens:
    - 32768
  router:
    endpoint_picker_config:
    - random.yaml
    - load-aware.yaml
    - queue-kv.yaml
