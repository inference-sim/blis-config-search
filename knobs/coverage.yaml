# How a spec reaches each property of the scenario and deployment documents (CFG-6).
# knob_table.py generates the property list from `blis schema`; this file only classifies it:
# `sweep` is a spec path, `reason` says why a search cannot vary it. A property missing here, an
# entry for a property that no longer exists, or a property under a prefix entry (`a.*`) that the
# entry's `covers` list does not name, fails `knob_table.py --check` (the checks workflow). A prefix
# entry therefore classifies only what a person reviewed; list a new property in `covers` after
# reviewing it, or give it an exact entry. Engine settings are not listed: the field list decides them.
knobs:
  scenario:name:
    reason: "the document's identity, derived from the experiment name"
  scenario:kind:
    reason: "the document's kind"
  scenario:model:
    reason: "one model per experiment (experiments/README.md); a second model is a second experiment"
  scenario:coefficients[]:
    reason: "the coefficient sets belong to the simulator release (CFG-1), not to a search"
  scenario:engine_version:
    reason: "derived from the engine kind's release"
  scenario:engine.kind:
    sweep: "scenario.engine_kind (one engine per experiment)"
  scenario:engine.version:
    reason: "derived from the engine kind's release"
  scenario:cluster.hardware:
    reason: "one hardware type per experiment (experiments/README.md); compare chips with two experiments"
  scenario:cluster.nodes:
    reason: "derived from scenario.gpus and the layout"
  scenario:cluster.gpus_per_node:
    reason: "a scenario constant (scenario.cluster.gpus_per_node), fixed by the hardware"
  scenario:cluster.gpus_per_rack:
    reason: "a catalog fact of the hardware, not a search dimension"
  scenario:cluster.fabric:
    reason: "a scenario constant (scenario.cluster.fabric); compare fabrics with two experiments"
  scenario:cluster.pools[].hardware:
    reason: "node pools of different chips have no spec key"
    issue: inference-sim/blis-config-search#143
  scenario:cluster.pools[].name:
    reason: "node pools of different chips have no spec key"
    issue: inference-sim/blis-config-search#143
  scenario:cluster.storage[]:
    reason: "the storage tiers belong to the catalog hardware entry, not a search dimension"
  scenario:cluster.switch_groups[]:
    reason: "the switch topology belongs to the cluster the experiment describes, not a search dimension"
  scenario:cluster.uplink_oversubscription:
    reason: "the switch topology belongs to the cluster the experiment describes, not a search dimension"
  scenario:acceptance.*:
    reason: "the acceptance of a drafter is read from the catalog's measured profile and recorded with its source on each arm"
    covers:
      - scenario:acceptance.exact_only
      - scenario:acceptance.fallback_category
      - scenario:acceptance.profiles
      - scenario:acceptance.value.acceptance_length
      - scenario:acceptance.value.acceptance_rate
      - scenario:acceptance.value.num_spec_tokens
      - scenario:acceptance.value.per_position_rates[]
      - scenario:acceptance.value.realisation
      - scenario:acceptance.value.source
  scenario:routing.*:
    reason: "the routing profile is read from the catalog's measured profile, not chosen by a search"
    covers:
      - scenario:routing.fallback_category
      - scenario:routing.profiles
      - scenario:routing.value.expert_imbalance
      - scenario:routing.value.source
      - scenario:routing.value.token_imbalance
  scenario:workload.*:
    reason: "one workload per experiment (experiments/README.md); the replay's constants come from scenario.replay and the workload descriptor"
    covers:
      - scenario:workload.replay.acceptance.acceptance_length
      - scenario:workload.replay.acceptance.acceptance_rate
      - scenario:workload.replay.acceptance.num_spec_tokens
      - scenario:workload.replay.acceptance.per_position_rates[]
      - scenario:workload.replay.acceptance.realisation
      - scenario:workload.replay.acceptance.source
      - scenario:workload.replay.benchmark_duration_s
      - scenario:workload.replay.cache_bust
      - scenario:workload.replay.category
      - scenario:workload.replay.concurrency
      - scenario:workload.replay.corpus.encoding
      - scenario:workload.replay.corpus.format
      - scenario:workload.replay.corpus.loader
      - scenario:workload.replay.corpus.sha256
      - scenario:workload.replay.corpus.source.file
      - scenario:workload.replay.corpus.source.huggingface
      - scenario:workload.replay.corpus.source.revision
      - scenario:workload.replay.corpus.source.split
      - scenario:workload.replay.grace_period_s
      - scenario:workload.replay.harness_version
      - scenario:workload.replay.ignore_eos
      - scenario:workload.replay.ignore_trace_delays
      - scenario:workload.replay.inter_turn_delay_cap_s
      - scenario:workload.replay.load.measured_sessions
      - scenario:workload.replay.load.recycling
      - scenario:workload.replay.load.trace_idle_gap_cap_s
      - scenario:workload.replay.load.warmup_duration_s
      - scenario:workload.replay.max_context_length
      - scenario:workload.replay.random_seed
      - scenario:workload.replay.routing.expert_imbalance
      - scenario:workload.replay.routing.source
      - scenario:workload.replay.routing.token_imbalance
      - scenario:workload.replay.scenario
      - scenario:workload.replay.split_flattened_agents
      - scenario:workload.replay.streaming
      - scenario:workload.replay.synthesis_max_isl
      - scenario:workload.replay.system_idle_gap_cap_s
      - scenario:workload.replay.thinking
      - scenario:workload.replay.trace_idle_gap_cap_s
      - scenario:workload.replay.trajectory_start.max_ratio
      - scenario:workload.replay.trajectory_start.min_ratio
      - scenario:workload.replay.warmup.duration_s
      - scenario:workload.replay.warmup.mode
      - scenario:workload.replay.warmup.requests_per_lane
      - scenario:workload.replay.workload
      - scenario:workload.shape
      - scenario:workload.trace.acceptance.acceptance_length
      - scenario:workload.trace.acceptance.acceptance_rate
      - scenario:workload.trace.acceptance.num_spec_tokens
      - scenario:workload.trace.acceptance.per_position_rates[]
      - scenario:workload.trace.acceptance.realisation
      - scenario:workload.trace.acceptance.source
      - scenario:workload.trace.category
      - scenario:workload.trace.data
      - scenario:workload.trace.header.acceptance.category
      - scenario:workload.trace.header.acceptance.thinking
      - scenario:workload.trace.header.acceptance.value.acceptance_length
      - scenario:workload.trace.header.acceptance.value.acceptance_rate
      - scenario:workload.trace.header.acceptance.value.num_spec_tokens
      - scenario:workload.trace.header.acceptance.value.per_position_rates[]
      - scenario:workload.trace.header.acceptance.value.realisation
      - scenario:workload.trace.header.acceptance.value.source
      - scenario:workload.trace.header.goodput_slo_targets
      - scenario:workload.trace.header.kv_offload.block_size
      - scenario:workload.trace.header.kv_offload.blocks_per_chunk
      - scenario:workload.trace.header.kv_offload.cpu_bytes_to_use
      - scenario:workload.trace.header.kv_offload.eviction_policy
      - scenario:workload.trace.header.kv_offload.lazy_offload
      - scenario:workload.trace.header.kv_offload.offload_prompt_only
      - scenario:workload.trace.header.kv_offload.per_block_bytes
      - scenario:workload.trace.header.kv_offload.secondary_tiers[].base_latency
      - scenario:workload.trace.header.kv_offload.secondary_tiers[].capacity_bytes
      - scenario:workload.trace.header.kv_offload.secondary_tiers[].device_class
      - scenario:workload.trace.header.kv_offload.secondary_tiers[].direct_io
