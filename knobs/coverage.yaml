  deployment:kind:
    reason: "the document's kind"
  deployment:name:
    reason: "the document's identity, derived from the arm"
  deployment:pools[].role:
    sweep: "sweeps[].prefill-instances, sweeps[].decode-instances"
  deployment:pools[].nodes:
    sweep: "sweeps[].num-instances (nodes follow the layout)"
  deployment:pools[].labels:
    reason: "router selectors are derived from the pool's role"
  deployment:pools[].engine:
    sweep: "sweeps[].engine.<setting> (the engine rows)"
  deployment:pools[].parallel.tp:
    sweep: "sweeps[].parallel.tp"
  deployment:pools[].parallel.dp:
    sweep: "sweeps[].parallel.dp"
  deployment:pools[].parallel.pp:
    sweep: "sweeps[].parallel.pp"
  deployment:pools[].parallel.pcp:
    sweep: "sweeps[].parallel.pcp"
  deployment:pools[].parallel.dcp:
    sweep: "sweeps[].parallel.dcp"
  deployment:pools[].parallel.dp_local:
    sweep: "sweeps[].parallel.dp_local"
  deployment:pools[].parallel.enable_expert_parallel:
    sweep: "sweeps[].parallel.enable_expert_parallel"
  deployment:pools[].parallel.data_parallel_load_balancing:
    sweep: "sweeps[].parallel.data_parallel_load_balancing"
  deployment:offload.tiers[].bytes:
    sweep: "sweeps[].offload.cpu_bytes (0 is the control)"
  deployment:offload.eviction_policy:
    sweep: sweeps[].offload.eviction_policy
  deployment:offload.tiers[].tier:
    reason: "the spec states the CPU tier only; the fs, obj and p2p tiers have no key yet"
    issue: inference-sim/blis-config-search#94
  deployment:offload.*:
    reason: "the connector, its spec, its options and the prefetch depth take the simulator's defaults; secondary tiers have no key"
    issue: inference-sim/blis-config-search#94
    covers:
      - deployment:offload.connector
      - deployment:offload.connector_options
      - deployment:offload.prefetch_depth
      - deployment:offload.spec
  deployment:pd_transfer.connector:
    reason: "the P/D connector has no spec key"
    issue: inference-sim/blis-config-search#144
  deployment:router.endpoint_picker_config:
    sweep: "sweeps[].router.endpoint_picker_config"
  deployment:router.epp_flags[]:
    reason: "router flags have no spec key"
    issue: inference-sim/blis-config-search#144
  deployment:router.manifests[]:
    reason: "router manifests have no spec key"
    issue: inference-sim/blis-config-search#144

# The M3.1 capabilities of inference-sim, each pointing at the knob rows that carry it.
capabilities:
  sglang-engine:
    requires_engine: sglang
    rows: ["scenario:engine.kind", "engine:sglang:config:chunked_prefill_size"]
    note: the engine kind of an experiment, and the SGLang settings the simulator models
  multi-node-pd-handoff:
    rows: ["deployment:pools[].role", "deployment:pools[].nodes", "deployment:pools[].parallel.dp", "deployment:pools[].parallel.tp"]
    note: prefill and decode pools of different layout, including a prefill pool whose data-parallel ranks span nodes (Handoff.At)
  per-rank-cpu-tier:
    rows: ["deployment:offload.tiers[].bytes"]
    note: the CPU KV tier and its size, off as the control
  offload-with-drafting:
    rows: ["deployment:offload.tiers[].bytes", "engine:vllm:config:speculative_config.method"]
    note: the KV tier beside an EAGLE-3 or MTP drafter
  dp-balancing-modes:
    rows: ["deployment:pools[].parallel.data_parallel_load_balancing"]
    note: the data-parallel load-balancing mode of a pool
  all-reduce-lane:
    rows: ["engine:vllm:config:disable_custom_all_reduce"]
    note: custom or NCCL all-reduce (the field list says why it is not swept yet)
  moe-backend:
    rows: ["engine:vllm:config:moe_backend"]
    note: the MoE kernel backend (the field list says why it is not swept yet)
  block-size:
    rows: ["engine:vllm:config:block_size"]
    note: the KV block size
