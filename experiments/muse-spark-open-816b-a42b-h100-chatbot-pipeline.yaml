# Does pipeline parallelism pay for Muse-Spark on 16 H100s, and which knobs move with the cut?
# Facts that picked the axes: MoE 256 experts top-8 (EP, all2all, eplb are real), graph declares
# pipeline_boundary_bytes_per_token (pp is priced), no speculator, checkpoint already modelopt.
# Footprint floor on the pin: 8 GPUs per pipeline; every 4-GPU instance and 2x tp1 pp8 refuse,
# and pp x dp is unpriced, so pp shapes and dp shapes live in separate sweeps.
# max_model_len 8192: chatbot needs <= 1824 tokens, and 262144 refuses 2x tp8 on KV.
# Left out: drafting, quantization, prefix caching, moe_backend, routing and long_prefill (measured
# inert or under 1% on uniform chatbot traffic). Bounded to ~1h serial at ~1s per run.
name: muse-spark-open-816b-a42b-h100-chatbot-pipeline

scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: h100
  workload: chatbot
  gpus: 16
  # The grid's ITL floor is ~38ms p99 (tp16, c=8), so a 20-25ms SLO admits nothing.
  slo: {itl_p99: 100ms}
  concurrency: [8, 32, 128, 256, 512]

sweeps:
  # 7 shapes: tp16, tp8 pp2, tp4 pp4, tp2 pp8 at 1 instance; tp8, tp4 pp2, tp2 pp4 at 2.
  - name: pipeline-batch
    narrative: Pipeline stages only pay once the batch cap is high enough to keep every stage busy, so pp should lose least at large max_num_seqs.
    num-instances: [1, 2]
    parallel: {tp: [16, 8, 4, 2], pp: [1, 2, 4, 8], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      max_num_seqs: [16, 32, 64, 128, 256, 512]
      max_num_batched_tokens: [2048, 4096, 8192, 16384, 32768]

  - name: dp-batch
    narrative: Data-parallel attention splits the batch across ranks, so the batch caps should bind later at tp4 dp4 than at tp8 dp2.
    num-instances: [1]
    parallel: {tp: [8, 4], dp: [2, 4], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      max_num_seqs: [16, 32, 64, 128, 256, 512]
      max_num_batched_tokens: [2048, 4096, 8192, 16384, 32768]

  # deepep_low_latency's RDMA buffer scales with max_num_batched_tokens; it refuses at 2048 on dp2.
  - name: moe-collective
    narrative: DeepEP backends should cost more as dp widens, and low-latency should fit only at small step budgets.
    num-instances: [1]
    parallel: {tp: [16, 8, 4], dp: [1, 2, 4], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      all2all_backend: [allgather_reducescatter, deepep_high_throughput, deepep_low_latency, deepep_v2, pplx]
      max_num_batched_tokens: [1024, 2048, 4096, 8192, 16384]
      max_num_seqs: [64, 256, 512]

  # Redundancy values keep 256 + r divisible by the EP width 16.
  - name: eplb
    narrative: Redundant experts should cost a little memory and buy nothing on uniform synthetic routing.
    num-instances: [1]
    parallel: {tp: [16, 8, 4], dp: [1, 2, 4], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      eplb: {enable_eplb: [true], num_redundant_experts: [0, 16, 32]}
      all2all_backend: [allgather_reducescatter, deepep_high_throughput, deepep_v2]

  - name: kv-capacity-pipeline
    narrative: Narrower tensor groups hold more weight per rank, so KV headroom should bind on 2-instance and deep-pp shapes, not on tp16.
    num-instances: [1, 2]
    parallel: {tp: [16, 8, 4, 2], pp: [1, 2, 4, 8], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      cache_dtype: [auto, fp8]
      gpu_memory_utilization: [0.8, 0.9, 0.95]
      max_num_seqs: [256, 512]

  - name: kv-capacity-dp
    narrative: Data-parallel ranks each replicate attention weights, so fp8 KV and memory utilization should matter more at tp4 dp4.
    num-instances: [1]
    parallel: {tp: [8, 4], dp: [2, 4], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      cache_dtype: [auto, fp8]
      gpu_memory_utilization: [0.8, 0.9, 0.95]
      max_num_seqs: [256, 512]

  # Full capture costs memory: FULL refused on 2x tp8 at 0.9 utilization but ran at 0.95.
  - name: cudagraph-pipeline
    narrative: Full graph capture should cut per-step launch cost on every cut, but only where the memory it reserves still fits.
    num-instances: [1, 2]
    parallel: {tp: [16, 8, 4, 2], pp: [1, 2, 4, 8], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      cudagraph_mode: [NONE, PIECEWISE, FULL, FULL_AND_PIECEWISE]
      gpu_memory_utilization: [0.9, 0.95]

  - name: cudagraph-dp
    narrative: Graph capture should help the data-parallel shapes as much as the tensor-parallel ones, memory permitting.
    num-instances: [1]
    parallel: {tp: [8, 4], dp: [2, 4], enable_expert_parallel: [true]}
    engine:
      max_model_len: [8192]
      cudagraph_mode: [NONE, PIECEWISE, FULL, FULL_AND_PIECEWISE]
      gpu_memory_utilization: [0.9, 0.95]

  - name: expert-parallel
    narrative: Sharding experts should beat replicating them at tp16, and matter less once pipeline stages already split the weights.
    num-instances: [1, 2]
    parallel: {tp: [16, 8, 4], pp: [1, 2, 4], enable_expert_parallel: [true, false]}
    engine:
      max_model_len: [8192]
      max_num_seqs: [64, 256, 512]

  # The colocated twin is 2x tp8 / 2x tp4 pp2 in the sweeps above.
  - name: disaggregated
    narrative: Splitting prefill from decode should help little on short chatbot prompts, since the KV handoff costs more than the interference it removes.
    prefill-instances: [1]
    decode-instances: [1]
    prefill: {parallel: {tp: [8, 4], pp: [1, 2], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8, 4], pp: [1, 2], enable_expert_parallel: [true]}}
    engine:
      max_model_len: [8192]
      max_num_seqs: [64, 256, 512]
      max_num_batched_tokens: [2048, 8192, 16384]
    router: {endpoint_picker_config: [pd-always.yaml]}

  - name: pd-threshold
    narrative: Disaggregating only prompts above a few hundred tokens should keep short turns local and beat always-split.
    prefill-instances: [1]
    decode-instances: [1]
    prefill: {parallel: {tp: [8], enable_expert_parallel: [true]}}
    decode: {parallel: {tp: [8, 4], pp: [1, 2], enable_expert_parallel: [true]}}
    engine:
      max_model_len: [8192]
    router:
      endpoint_picker_config: [pd-prefix.yaml]
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [128, 256, 512, 1024]}}
