# Best tok/s/GPU for Muse-Spark (nvfp4) on one 8x H200 node under AgentX with no SLO (raw max), and which knobs travel.
# MoE 256 experts top_k 8: EP, dp attention and all2all_backend are real; graph prices pp; no speculator, already modelopt.
# Probed on the pin at 262k context: TP8, TP4 PP2, TP2 PP4, TP4 DP2, TP2 DP4 fit; 2x TP4 refuses.
# pp x dp is unpriced on the pin, so pipeline and data-parallel shapes are separate sweeps.
# InfiniBand is never priced: nothing leaves the node. No SLO, so the ladder runs to 64, past saturation (601ms at c=64).
# Left out: eplb, moe_backend (inert elsewhere), P/D (needs two nodes), quantization and drafting (profile: does not apply).
# Routing is left out too: 2x TP2 PP2, the only 2-instance shape, falls 0.04 GiB short of KV on vLLM 0.32.0 even at gmu 0.95.

name: muse-spark-open-816b-a42b-h200-agentx-8gpu

scenario:
  model: muse-spark-open-816b-a42b-nvfp4
  hardware: h200
  cluster: {gpus_per_node: 8}   # an 8-GPU HGX server; the catalog fixes no node size for this chip
  workload_spec: workloads/agentx-run-recipe.yaml   # the full AgentX run recipe
  gpus: 8
  engine: {max_model_len: 262144}   # at the 32k default the replay drops every trace
  concurrency: [4, 8, 16, 32, 64]    # session lanes, out to saturation
  replay:
    corpus: .corpus/traces.jsonl
    corpus_cache: /tmp/agx-cache-muse-h200
    # grace_period: the recipe's 30 s. An infinite grace makes the measured window run to the drain
    # (output_tok_s falls 100-fold); restoring it waits on the simulator's window semantics (blis-config-search#102).

# Data parallelism above 1 is not swept: vLLM refuses to build Muse-Spark's Hopper MoE path with it
# ("MuseSpark1x Triton/Marlin currently requires DP1 and PCP1", muse_moe_runner.py:140-146), and the pinned
# simulator refuses the same shapes. Blackwell is not affected (the GB200 specifications sweep dp).

sweeps:
  - name: topology-pp
    # The control for the pipeline shapes below.
    narrative: TP8 should peak highest, since every pipeline stage adds a boundary hop to each decode step.
    num-instances: [1]
    parallel: {tp: [8, 4, 2], pp: [1, 2, 4], enable_expert_parallel: [true]}

  - name: batch-caps
    narrative: A seq cap of 8 should bind on TP8, where one attention rank sees every lane.
    num-instances: [1]
    parallel: {tp: [8], dp: [1], enable_expert_parallel: [true]}
    engine:
      max_num_seqs: [8, 16]
      max_num_batched_tokens: [2048, 4096, 16384, 32768]

  - name: kv-capacity
    narrative: fp8 KV and higher memory utilization should substitute on TP8.
    num-instances: [1]
    parallel: {tp: [8], dp: [1], enable_expert_parallel: [true]}
    engine:
      cache_dtype: [auto, fp8]
      gpu_memory_utilization: [0.85, 0.95]

  - name: moe-collective
    # Default allgather_reducescatter twins are in topology-pp; EP width is 8 on both.
    narrative: DeepEP low-latency should win on TP8.
    num-instances: [1]
    parallel: {tp: [8], dp: [1], enable_expert_parallel: [true]}
    engine:
      all2all_backend: [deepep_high_throughput, deepep_low_latency, deepep_v2, pplx]

  - name: prefill-chunking
    narrative: Capping long prefills should trade a little peak throughput for a much lower ITL p99 at saturation.
    num-instances: [1]
    parallel: {tp: [8, 4], pp: [1, 2], enable_expert_parallel: [true]}
    engine:
      long_prefill_token_threshold: [2048, 8192]

  - name: cudagraph
    # Per-step host cost; measured not to interact with topology, so one shape.
    narrative: FULL-family capture should beat the PIECEWISE default by a few percent, and NONE should collapse.
    num-instances: [1]
    parallel: {tp: [8], enable_expert_parallel: [true]}
    engine:
      cudagraph_mode: [NONE, FULL, FULL_AND_PIECEWISE]
