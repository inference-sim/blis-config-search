# DISAGGREGATE EVERY REQUEST. llm-d's deploy/config/pd-epp-config.yaml with the
# always-disagg-pd-decider, copied from inference-sim/blis-vllm's own P/D test scenario
# (testdata/scenarios/router/pd-always.yaml) so the simulated router runs the same file the
# upstream P/D tests do.
#
# Use it as the UPPER BOUND on disaggregation: every request pays the KV handoff, so it shows
# what the split costs when nothing is exempt. `pd-prefix.yaml` is the selective counterpart.
#
# This arm only applies to a sweep with prefill/decode pools -- the prefill-filter and
# decode-filter plugins need role-labelled pods, which a colocated deployment does not have.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: approx-prefix-cache-producer
  parameters:
    maxPrefixTokensToMatch: 16384
    lruCapacityPerServer: 31250
- type: prefix-cache-scorer
- type: queue-scorer
- type: prefill-filter
- type: decode-filter
- type: max-score-picker
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciders:
      prefill: always-disagg-pd-decider
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
