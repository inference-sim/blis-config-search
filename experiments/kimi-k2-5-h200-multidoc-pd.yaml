# Colocated vs. P/D-disaggregated Kimi-K2.5 on 64 H200s for 10k-token prompts: which ratio, which pool shape, which split threshold.
# MoE 384 experts, MLA, ~1T params: tp4 dp1 refuses (138.8 GiB fixed per rank), so every instance is EP width >= 8.
# P/D pools stay at dp1: the pinned engine has no kv_transfer under dp yet (blis-vllm#44).
# Multidoc prompts are 10,240 +- 1,200 tokens with no shared prefix, so nonCachedTokens is effectively a prompt-length cut.
# Left out: all2all_backend (inert at dp1; deepep_high_throughput 2.5x worse at dp2, measured), max_num_seqs (the token cap
# binds first on 10k prompts), prefix caching and routing scorers (inert on a generated shape), cache_dtype (MLA KV is small).
name: kimi-k2-5-h200-multidoc-pd

scenario:
  model: kimi-k2.5
  hardware: h200
  cluster: {gpus_per_node: 8}   # an 8-GPU HGX server; the catalog fixes no node size for this chip
  workload: multidoc
  gpus: 64
  slo: {itl_p99: 20ms, ttft_p99: 5s}
  concurrency: [8, 16, 32, 64, 128]   # c=256 missed ITL p99 by 6-10x in probes

sweeps:
  - name: colocated
    narrative: The colocated control should hold ITL only with a chunked-prefill cap, and the wide-dp shapes should give the most tokens per GPU.
    num-instances: [4, 8]
    parallel: {tp: [2, 4, 8, 16], dp: [1, 2, 4], enable_expert_parallel: [true]}
    engine:
      max_num_batched_tokens: [8192, 32768]
      long_prefill_token_threshold: [0, 1024, 4096]

  - name: pd-dp1
    # Ratios 1-5P x 2-6D bracket the prefill-heavy optimum; 11 layouts survive the GPU filter at tp8/tp16.
    narrative: Prefill-heavy ratios should win on 10k prompts, and a threshold near the median prompt should beat splitting every request.
    prefill-instances: [1, 2, 3, 4, 5]
    decode-instances: [2, 3, 4, 5, 6]
    prefill:
      parallel: {tp: [8, 16], enable_expert_parallel: [true]}
      engine: {max_num_batched_tokens: [8192, 32768]}
    decode:
      parallel: {tp: [8, 16], enable_expert_parallel: [true]}
      engine: {long_prefill_token_threshold: [0, 1024]}
    router: &threshold
      endpoint_picker_config: [pd-prefix-based.yaml]
      plugins:
        prefix-based-pd-decider: {parameters: {nonCachedTokens: [256, 10240, 12288]}}

  - name: pd-always
    # Same dp1 layouts as pd-dp1; overrides take one base file, so the always-split decider is its own sweep.
    narrative: Splitting every request should cost ITL headroom against the threshold arms, because each handoff stalls a decode slot.
    prefill-instances: [1, 2, 3, 4, 5]
    decode-instances: [2, 3, 4, 5, 6]
    prefill:
      parallel: {tp: [8, 16], enable_expert_parallel: [true]}
      engine: {max_num_batched_tokens: [8192, 32768]}
    decode: {parallel: {tp: [8, 16], enable_expert_parallel: [true]}}   # never prefills here
    router: {endpoint_picker_config: [pd-always.yaml]}
