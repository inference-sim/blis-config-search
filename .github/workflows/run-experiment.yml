name: run-experiment

# The deterministic sweeper, in CI. A contributor opens a PR adding experiments/<name>.yaml;
# checks.yml validates it (no secrets, safe for forks). After the spec is MERGED, this workflow
# runs the sweep and opens a FOLLOW-UP PR adding reports/<name>/ plus the gallery entry. Merging
# that PR publishes through pages.yml.
#
#   spec PR  --validate-->  merge  --sweep-->  bot PR (adds the report)  --merge-->  published
#
# Why this is safe, and why it needs no LLM approval gate:
#   * The sweeper has NO LLM. It expands the spec's grids, filters on GPU arithmetic, runs BLIS
#     at the pinned refs with a fixed seed, and ranks by an executable rule. Given the same spec
#     and the same pins it produces the same report, so there is nothing non-hermetic to gate --
#     unlike generate-report.yml, whose search brain is a model and which therefore keeps its
#     maintainer-approved environment.
#   * No secrets are used. Nothing is published: the report lands on a bot branch for review,
#     and publishing is still gated on a human merging that PR.
#   * It never writes to main. The bot PR is the only output.
#
# A maintainer can also dispatch this manually with `spec: all` or a list of specs already on
# main (e.g. to regenerate reports after a pins or sweeper change).

on:
  push:
    branches: [main]
    paths:
      - "experiments/**.yaml"
  workflow_dispatch:
    inputs:
      spec:
        description: "'all', or space-separated experiments/<name>.yaml (blank = specs the last commit changed)"
        required: false
      timeout:
        description: "per-BLIS-run timeout in seconds"
        required: false
        default: "600"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # diff against the commit before the push, however far back

      - name: Decide which specs to run
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.spec }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = all ]; then
            specs="$(ls experiments/*.yaml)"
          elif [ -n "$REQUESTED" ]; then
            specs=""
            for spec in $REQUESTED; do
              case "$spec" in
                experiments/*.yaml) ;;
                *) echo "spec must be experiments/<name>.yaml: $spec" >&2; exit 1 ;;
              esac
              case "$spec" in *..*|/*) echo "unsafe path: $spec" >&2; exit 1 ;; esac
              test -f "$spec" || { echo "no such spec: $spec" >&2; exit 1; }
              specs="$specs$spec"$'\n'
            done
          else
            # Only the specs this push touched (all its commits, not just the last one).
            old=HEAD^
            if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then old="$BEFORE"; fi
            specs="$(git diff --name-only --diff-filter=d "$old" HEAD -- 'experiments/*.yaml' || true)"
          fi
          echo "will run:"; echo "${specs:-none}"
          # JSON list for the sweep matrix: one job (runner, timeout, PR) per spec.
          echo "specs=$(printf '%s\n' "$specs" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    if: needs.plan.outputs.specs != '[]'
    # The AgentX replays need more memory than a hosted runner has; same runner as regen-reports.
    runs-on: ${{ fromJSON(vars.REGEN_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: ${{ fromJSON(vars.REGEN_TIMEOUT_MINUTES || '350') }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.REGEN_MAX_PARALLEL || '4') }}
      matrix:
        spec: ${{ fromJSON(needs.plan.outputs.specs) }}
    name: sweep ${{ matrix.spec }}
    # Specs run side by side; repeat runs of one spec queue instead of doubling the BLIS cost.
    concurrency:
      group: run-experiment-${{ matrix.spec }}
      cancel-in-progress: false
    env:
      SPEC: ${{ matrix.spec }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the report
        id: name
        # The report dir is the spec's name field, which need not match its file name.
        run: |
          echo "name=$(sed -n 's/^name: *//p' "$SPEC" | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml

      - name: Clone the catalog the specs are validated against
        run: |
          set -euo pipefail
          # Cloned BEFORE validation rather than with the rest of the stack, so the existence
          # check on scenario.model/hardware/workload runs while it can still save the expensive
          # step. A typo'd identifier validates clean and dry-runs clean with no catalog, then
          # fails EVERY run after the Go build -- the wasted CI job the validator exists to
          # prevent (susiejojo review). A shallow catalog clone costs seconds, the build minutes.
          set -a; . ./pins.env; set +a
          git clone --branch "$CATALOG_REF" --depth 1 https://github.com/inference-sim/blis-catalog.git
          echo "BLIS_CATALOG=$PWD/blis-catalog" >> "$GITHUB_ENV"

      - name: Validate before building anything
        run: |
          set -euo pipefail
          python3 -I scripts/validate_experiment.py "$SPEC" --catalog "$BLIS_CATALOG"
          python3 -I scripts/run_experiment.py "$SPEC" --dry-run --catalog "$BLIS_CATALOG"

      - name: Clone the pinned simulator
        run: |
          set -euo pipefail
          # pins.env is the single source of truth for which simulator priced these runs; never
          # hard-code a ref here (scripts/test_build.py enforces the agreement).
          set -a; . ./pins.env; set +a
          git clone --branch "$BLIS_REF" --depth 1 https://github.com/inference-sim/inference-sim.git upstream
          # The tag is not immutable upstream; refuse to build a moved tag (same check as SETUP.md).
          test "$(git -C upstream rev-parse HEAD)" = "$BLIS_SHA" || {
            echo "$BLIS_REF no longer resolves to $BLIS_SHA -- aborting" >&2; exit 1; }
      - uses: actions/setup-go@v7
        with: { go-version-file: upstream/go.mod, cache-dependency-path: upstream/go.sum }
      - name: Build BLIS and clone the rest of the stack
        run: |
          set -euo pipefail
          set -a; . ./pins.env; set +a
          ( cd upstream && go build -o blis main.go )
          git clone --branch "$REGISTRY_REF" --depth 1 https://github.com/inference-sim/blis-registry.git
          echo "BLIS_REGISTRY=$PWD/blis-registry" >> "$GITHUB_ENV"
          echo "BLIS_BIN=$PWD/upstream/blis"      >> "$GITHUB_ENV"

      - name: Fetch the replay corpus
        run: |
          set -euo pipefail
          # A REPLAY workload's corpus is the one input neither the spec nor a clone can carry:
          # blis-catalog says it is not vendored (568 MB), so a consumer fetches it and checks it
          # against the descriptor's sha256. The script reads the dataset, the PINNED revision and
          # the digest out of the catalog we just cloned, so there is no second copy of that pin to
          # drift. A generated-shape spec needs nothing and the step is a no-op.
          python3 -I scripts/fetch_corpus.py "$SPEC" --catalog "$BLIS_CATALOG"

      - name: Run the sweeper
        run: |
          set -euo pipefail
          python3 -I scripts/run_experiment.py "$SPEC" \
            --blis "$BLIS_BIN" --catalog "$BLIS_CATALOG" --registry "$BLIS_REGISTRY" \
            --out reports/ --timeout "${{ github.event.inputs.timeout || '600' }}"

      - name: Build the site to validate the new reports
        run: python3 -I scripts/build_gallery.py --no-mock --out /tmp/site-check

      - uses: actions/upload-artifact@v7
        with:
          name: report-${{ steps.name.outputs.name }}
          path: reports/${{ steps.name.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  pr:
    needs: [plan, sweep]
    # The big runner's image has no gh, so the PR is opened here; one leg per spec that finished.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.specs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.plan.outputs.specs) }}
    name: pr ${{ matrix.spec }}
    permissions:
      contents: write          # push the bot branch
      pull-requests: write     # open the follow-up PR
    env:
      SPEC: ${{ matrix.spec }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the report
        id: name
        # The report dir is the spec's name field, which need not match its file name.
        run: |
          echo "name=$(sed -n 's/^name: *//p' "$SPEC" | head -1)" >> "$GITHUB_OUTPUT"

      # A pattern, not a name: a failed sweep leaves no artifact, and that must not error here.
      - uses: actions/download-artifact@v8
        with:
          pattern: report-${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/artifacts

      - name: Swap the new report in
        id: swap
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          set -euo pipefail
          art="$RUNNER_TEMP/artifacts/report-$NAME"
          if [ ! -d "$art" ]; then
            echo "::warning::no report for $SPEC (its sweep failed or was canceled)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rm -rf "reports/$NAME"
          cp -r "$art" "reports/$NAME"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Open the follow-up PR
        if: steps.swap.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          names: ${{ steps.name.outputs.name }}
        run: |
          set -euo pipefail
          # One branch per spec, so parallel matrix jobs never push to the same ref.
          branch="experiment-report/${GITHUB_SHA::10}-$names"
          git config user.name  "blis-config-search-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$branch"
          # The generated BLIS scenario YAMLs are reproducible intermediates, not results: they
          # are regenerated byte-identically from the spec, so they stay out of the committed
          # report (.gitignore also covers them).
          rm -rf reports/*/scenarios
          git add reports/
          if git diff --cached --quiet; then
            echo "the sweeper produced no changes -- nothing to open a PR for"
            exit 0
          fi
          git commit -m "ci: add experiment report(s) for $names

          Produced by scripts/run_experiment.py from the merged spec(s) at ${GITHUB_SHA::10},
          against the stack pinned in pins.env. No LLM in this path: the grids, the GPU filter,
          the runs and the winner are all deterministic, so re-running the same spec on the same
          pins reproduces this report."
          git push origin "$branch"
          gh pr create \
            --title "Experiment report(s): $names" \
            --body "Generated by \`run-experiment.yml\` from the spec(s) merged in ${GITHUB_SHA::10}.

          **This is machine-generated measurement data.** The sweeper has no LLM: it expanded each
          sweep's grid, dropped combos that did not use exactly the scenario's GPU budget, ran BLIS
          at the pinned refs with the spec's fixed seed, and picked the winner by an executable
          rule (most output tok/s per GPU among runs holding the SLOs). The same spec and pins
          reproduce it.

          Review the numbers, then merge to publish through \`pages.yml\`." \
            --base main --head "$branch"
